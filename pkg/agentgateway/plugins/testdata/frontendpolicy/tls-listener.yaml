apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: test
  namespace: default
spec:
  gatewayClassName: dummy
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tls-policy
  namespace: default
spec:
  targetRefs:
  - kind: Gateway
    name: test
    group: gateway.networking.k8s.io
    sectionName: https
  frontend:
    tls:
      handshakeTimeout: 15s
---
# Output
output:
- Policy:
    frontend:
      tls:
        handshakeTimeout: 15s
    key: frontend/default/tls-policy:frontend-tls:default/test/https
    name:
      kind: AgentgatewayPolicy
      name: tls-policy
      namespace: default
    target:
      gateway:
        listener: https
        name: test
        namespace: default
status:
  ancestors:
  - ancestorRef:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: test
      namespace: default
      sectionName: https
    conditions:
    - lastTransitionTime: fake
      message: Policy accepted
      reason: Valid
      status: "True"
      type: Accepted
    - lastTransitionTime: fake
      message: Attached to all targets
      reason: Attached
      status: "True"
      type: Attached
    controllerName: agentgateway.dev/agentgateway

