#refresh=true
# A Service with one Pod, like a pilot-load `type: plain` application with `pods: 1`.
# Refreshing flips the Pod between ready and not ready. kgateway reads endpoints from
# EndpointSlices, so the slice the endpointslice controller would write flips with it.
apiVersion: v1
kind: Service
metadata:
  name: {{.Name}}
spec:
  clusterIP: 10.0.{{div .Index 256}}.{{mod .Index 256}}
  selector:
    app: {{.Name}}
  ports:
  - name: http
    port: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: {{.Name}}-0
  labels:
    app: {{.Name}}
spec:
  nodeName: node
status:
  phase: Running
  podIP: 10.1.{{div .Index 256}}.{{mod .Index 256}}
  podIPs:
  - ip: 10.1.{{div .Index 256}}.{{mod .Index 256}}
  conditions:
  - type: Ready
    status: "{{ if .Rand }}False{{ else }}True{{ end }}"
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{.Name}}-0
  labels:
    kubernetes.io/service-name: {{.Name}}
addressType: IPv4
ports:
- name: http
  port: 80
  protocol: TCP
endpoints:
- addresses:
  - 10.1.{{div .Index 256}}.{{mod .Index 256}}
  conditions:
    ready: {{ if .Rand }}false{{ else }}true{{ end }}
  nodeName: node
  targetRef:
    kind: Pod
    name: {{.Name}}-0
