Listeners:
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 8080
  filterChains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        httpFilters:
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        mergeSlashes: true
        normalizePath: true
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: listener~8080
        statPrefix: http_8080
        useRemoteAddress: true
    name: listener~8080
  name: listener~8080
Routes:
- ignorePortInHostMatching: true
  name: listener~8080
  virtualHosts:
  - domains:
    - '*.header.test'
    name: listener~8080~*_header_test
    routes:
    - match:
        headers:
        - name: Header-A
          stringMatch:
            exact: A
        pathSeparatedPrefix: /path
      name: listener~8080~*_header_test-route-0-httproute-wc-path-header-newer-default-0-0-matcher-0
      route:
        cluster: kube_default_newer-svc_8080
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
    - match:
        headers:
        - name: Header-B
          stringMatch:
            exact: B
        pathSeparatedPrefix: /path/prefix
      name: listener~8080~*_header_test-route-1-httproute-less-specific-wc-path-header-older-default-0-0-matcher-0
      route:
        cluster: kube_default_older-svc_8080
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
  - domains:
    - '*.wildcard.test'
    name: listener~8080~*_wildcard_test
    routes:
    - match:
        pathSeparatedPrefix: /path
      name: listener~8080~*_wildcard_test-route-0-httproute-wc-path-newer-default-0-0-matcher-0
      route:
        cluster: kube_default_newer-svc_8080
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
    - match:
        pathSeparatedPrefix: /path/prefix
      name: listener~8080~*_wildcard_test-route-1-httproute-less-specific-wc-path-older-default-0-0-matcher-0
      route:
        cluster: kube_default_older-svc_8080
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
  - domains:
    - header.example.com
    name: listener~8080~header_example_com
    routes:
    - match:
        headers:
        - name: Header-A
          stringMatch:
            exact: A
        pathSeparatedPrefix: /path
      name: listener~8080~header_example_com-route-0-httproute-exact-path-header-newer-default-0-0-matcher-0
      route:
        cluster: kube_default_newer-svc_8080
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
    - match:
        headers:
        - name: Header-B
          stringMatch:
            exact: B
        pathSeparatedPrefix: /path/prefix
      name: listener~8080~header_example_com-route-1-httproute-wc-path-header-older-default-0-0-matcher-0
      route:
        cluster: kube_default_older-svc_8080
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
  - domains:
    - path.example.com
    name: listener~8080~path_example_com
    routes:
    - match:
        pathSeparatedPrefix: /path
      name: listener~8080~path_example_com-route-0-httproute-exact-path-newer-default-0-0-matcher-0
      route:
        cluster: kube_default_newer-svc_8080
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
    - match:
        pathSeparatedPrefix: /path/prefix
      name: listener~8080~path_example_com-route-1-httproute-wc-path-older-default-0-0-matcher-0
      route:
        cluster: kube_default_older-svc_8080
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
