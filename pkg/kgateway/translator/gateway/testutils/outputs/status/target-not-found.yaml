Clusters:
- commonLbConfig:
    localityWeightedLbConfig: {}
  connectTimeout: 5s
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
  ignoreHealthOnHostRemoval: true
  name: kube_default_example-svc_80
  type: EDS
- connectTimeout: 5s
  name: test-backend-plugin_default_example-svc_80
Listeners:
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 80
  filterChains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        httpFilters:
        - disabled: true
          name: envoy.filters.http.cors
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        mergeSlashes: true
        normalizePath: true
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: listener~80
        statPrefix: http
        useRemoteAddress: true
    name: listener~80
  metadata:
    filterMetadata:
      merge.TrafficPolicy.gateway.kgateway.dev:
        cors:
        - gateway.kgateway.dev/TrafficPolicy/default/partial
  name: listener~80
Routes:
- ignorePortInHostMatching: true
  metadata:
    filterMetadata:
      merge.TrafficPolicy.gateway.kgateway.dev:
        cors:
        - gateway.kgateway.dev/TrafficPolicy/default/partial
  name: listener~80
  typedPerFilterConfig:
    envoy.filters.http.cors:
      '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
      allowOriginStringMatch:
      - exact: https://example.com
      forwardNotMatchingPreflights: false
      maxAge: "5"
  virtualHosts:
  - domains:
    - example.com
    name: listener~80~example_com
    routes:
    - match:
        prefix: /
      name: listener~80~example_com-route-0-httproute-route-a-default-0-0-rule-a-matcher-0
      route:
        cluster: kube_default_example-svc_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
Statuses:
  gateways:
    default/example-gateway:
      conditions:
      - lastTransitionTime: null
        message: Successfully accepted Gateway
        reason: Accepted
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: Successfully programmed Gateway
        reason: Programmed
        status: "True"
        type: Programmed
      - lastTransitionTime: null
        message: Successfully resolved all Gateway references
        reason: ResolvedRefs
        status: "True"
        type: ResolvedRefs
      listeners:
      - attachedRoutes: 1
        conditions:
        - lastTransitionTime: null
          message: Successfully accepted Listener
          reason: Accepted
          status: "True"
          type: Accepted
        - lastTransitionTime: null
          message: Successfully verified that Listener has no conflicts
          reason: NoConflicts
          status: "False"
          type: Conflicted
        - lastTransitionTime: null
          message: Successfully resolved all references
          reason: ResolvedRefs
          status: "True"
          type: ResolvedRefs
        - lastTransitionTime: null
          message: Successfully programmed Listener
          reason: Programmed
          status: "True"
          type: Programmed
        name: http
        supportedKinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        - group: gateway.networking.k8s.io
          kind: GRPCRoute
  httpRoutes:
    default/route-a:
      parents:
      - conditions:
        - lastTransitionTime: null
          message: Successfully accepted Route
          reason: Accepted
          status: "True"
          type: Accepted
        - lastTransitionTime: null
          message: Successfully resolved all references
          reason: ResolvedRefs
          status: "True"
          type: ResolvedRefs
        - lastTransitionTime: null
          message: Successfully programmed Route
          reason: Programmed
          status: "True"
          type: kgateway.dev/Programmed
        controllerName: kgateway
        parentRef:
          group: ""
          kind: ""
          name: example-gateway
  policies:
    BackendConfigPolicy/default/missing-service:
      ancestors:
      - ancestorRef:
          group: gateway.kgateway.dev
          kind: StatusSummary
          name: StatusSummary
        conditions:
        - lastTransitionTime: null
          message: Service default/missing-svc not found
          observedGeneration: 3
          reason: TargetNotFound
          status: "False"
          type: Accepted
        - lastTransitionTime: null
          message: Policy is not attached to targets that could not be resolved
          observedGeneration: 3
          reason: TargetNotFound
          status: "False"
          type: Attached
        controllerName: kgateway.dev/kgateway
    TrafficPolicy/default/bad-section:
      ancestors:
      - ancestorRef:
          group: gateway.kgateway.dev
          kind: StatusSummary
          name: StatusSummary
        conditions:
        - lastTransitionTime: null
          message: sectionName "rule-z" not found in HTTPRoute default/route-a
          observedGeneration: 1
          reason: TargetNotFound
          status: "False"
          type: Accepted
        - lastTransitionTime: null
          message: Policy is not attached to targets that could not be resolved
          observedGeneration: 1
          reason: TargetNotFound
          status: "False"
          type: Attached
        controllerName: kgateway.dev/kgateway
    TrafficPolicy/default/partial:
      ancestors:
      - ancestorRef:
          group: gateway.kgateway.dev
          kind: StatusSummary
          name: StatusSummary
        conditions:
        - lastTransitionTime: null
          message: HTTPRoute default/route-b-typo not found
          observedGeneration: 2
          reason: TargetNotFound
          status: "False"
          type: Accepted
        - lastTransitionTime: null
          message: Policy is not attached to targets that could not be resolved
          observedGeneration: 2
          reason: TargetNotFound
          status: "False"
          type: Attached
        controllerName: kgateway.dev/kgateway
      - ancestorRef:
          group: gateway.networking.k8s.io
          kind: Gateway
          name: example-gateway
          namespace: default
        conditions:
        - lastTransitionTime: null
          message: Policy accepted
          observedGeneration: 2
          reason: Valid
          status: "True"
          type: Accepted
        - lastTransitionTime: null
