Clusters:
- commonLbConfig:
    localityWeightedLbConfig: {}
  connectTimeout: 5s
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
  ignoreHealthOnHostRemoval: true
  name: kube_default_example-svc_80
  type: EDS
Listeners:
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 8080
  filterChains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        httpFilters:
        - name: envoy.filters.http.health_check
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
            headers:
            - name: :path
              stringMatch:
                exact: /health
            passThroughMode: false
        - name: envoy.filters.http.grpc_stats
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.grpc_stats.v3.FilterConfig
            statsForAllMethods: true
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        mergeSlashes: true
        normalizePath: true
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: listener~8080
        serverName: custom-server
        statPrefix: http_8080
        useRemoteAddress: true
    name: listener~8080
  metadata:
    filterMetadata:
      merge.ListenerPolicy.gateway.kgateway.dev:
        default.httpSettings.grpcStats:
        - gateway.kgateway.dev/ListenerPolicy/default/http-section-policy
        default.httpSettings.healthCheckPolicy:
        - gateway.kgateway.dev/ListenerPolicy/default/http-section-policy
        default.httpSettings.serverName:
        - gateway.kgateway.dev/ListenerPolicy/default/http-section-policy
        default.perConnectionBufferLimitBytes:
        - gateway.kgateway.dev/ListenerPolicy/default/http-section-policy
  name: listener~8080
  perConnectionBufferLimitBytes: 4096
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 8081
  filterChains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        httpFilters:
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        mergeSlashes: true
        normalizePath: true
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: listener~8081
        statPrefix: http_8081
        useRemoteAddress: true
    name: listener~8081
  name: listener~8081
Routes:
- ignorePortInHostMatching: true
  metadata:
    filterMetadata:
      merge.ListenerPolicy.gateway.kgateway.dev:
        default.httpSettings.grpcStats:
        - gateway.kgateway.dev/ListenerPolicy/default/http-section-policy
        default.httpSettings.healthCheckPolicy:
        - gateway.kgateway.dev/ListenerPolicy/default/http-section-policy
        default.httpSettings.serverName:
        - gateway.kgateway.dev/ListenerPolicy/default/http-section-policy
        default.perConnectionBufferLimitBytes:
        - gateway.kgateway.dev/ListenerPolicy/default/http-section-policy
  name: listener~8080
  virtualHosts:
  - domains:
    - '*'
    name: listener~8080~*
    routes:
    - match:
        prefix: /
      name: listener~8080~*-route-0-httproute-http-route-default-0-0-matcher-0
      route:
        cluster: kube_default_example-svc_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
- ignorePortInHostMatching: true
  name: listener~8081
  virtualHosts:
  - domains:
    - a.example.com
    name: listener~8081~a_example_com
    routes:
    - match:
        prefix: /
      name: listener~8081~a_example_com-route-0-httproute-shared-route-a-default-0-0-matcher-0
      route:
        cluster: kube_default_example-svc_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
  - domains:
    - b.example.com
    name: listener~8081~b_example_com
    routes:
    - match:
        prefix: /
      name: listener~8081~b_example_com-route-0-httproute-shared-route-b-default-0-0-matcher-0
      route:
        cluster: kube_default_example-svc_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
