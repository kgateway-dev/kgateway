    localityWeightedLbConfig: {}
  connectTimeout: 5s
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
  ignoreHealthOnHostRemoval: true
  name: kube_default_http-svc_80
  type: EDS
- commonLbConfig:
    localityWeightedLbConfig: {}
  connectTimeout: 5s
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
  ignoreHealthOnHostRemoval: true
  name: kube_default_log-collector_9000
  type: EDS
- commonLbConfig:
    localityWeightedLbConfig: {}
  connectTimeout: 5s
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
  ignoreHealthOnHostRemoval: true
  name: kube_default_otel-collector_4317
  type: EDS
- commonLbConfig:
    localityWeightedLbConfig: {}
  connectTimeout: 5s
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
  ignoreHealthOnHostRemoval: true
  name: kube_default_tcp-svc_8000
  type: EDS
Listeners:
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 8000
  filterChains:
  - filters:
    - name: envoy.filters.network.tcp_proxy
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
        accessLog:
        - name: envoy.access_loggers.file
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.access_loggers.file.v3.FileAccessLog
            logFormat:
              formatters:
              - name: envoy.formatter.req_without_query
                typedConfig:
                  '@type': type.googleapis.com/envoy.extensions.formatter.req_without_query.v3.ReqWithoutQuery
              - name: envoy.formatter.metadata
                typedConfig:
                  '@type': type.googleapis.com/envoy.extensions.formatter.metadata.v3.Metadata
              jsonFormat:
                bytes_received: '%BYTES_RECEIVED%'
                bytes_sent: '%BYTES_SENT%'
                client_addr: '%DOWNSTREAM_REMOTE_ADDRESS%'
                duration: '%DURATION%'
                response_flags: '%RESPONSE_FLAGS%'
                upstream_host: '%UPSTREAM_HOST%'
            path: /dev/stdout
        - filter:
            andFilter:
              filters:
              - durationFilter:
                  comparison:
                    op: GE
                    value:
                      defaultValue: 100
              - notHealthCheckFilter: {}
          name: envoy.access_loggers.tcp_grpc
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.access_loggers.grpc.v3.TcpGrpcAccessLogConfig
            commonConfig:
              grpcService:
                envoyGrpc:
                  clusterName: kube_default_log-collector_9000
              logName: tcp-grpc-accesslog
              transportApiVersion: V3
        - name: envoy.access_loggers.open_telemetry
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.access_loggers.open_telemetry.v3.OpenTelemetryAccessLogConfig
            body:
              stringValue: '%DOWNSTREAM_REMOTE_ADDRESS% %BYTES_SENT%'
            grpcService:
              envoyGrpc:
                clusterName: kube_default_otel-collector_4317
            logName: tcp-otel-accesslog
            resourceAttributes:
              values:
              - key: service.name
                value:
                  stringValue: example-gateway.default
              - key: service.namespace
                value:
                  stringValue: default
              - key: service.version
                value:
                  stringValue: v1.0.0-ci1
              - key: k8s.namespace.name
                value:
                  stringValue: default
              - key: k8s.container.name
                value:
                  stringValue: kgateway-proxy
        cluster: kube_default_tcp-svc_8000
        statPrefix: tcp_8000_default_example-tcp-route
    name: listener~8000-default.example-tcp-route-rule-0
  metadata:
    filterMetadata:
      merge.ListenerPolicy.gateway.kgateway.dev:
        default.httpSettings.accessLog:
        - gateway.kgateway.dev/ListenerPolicy/default/access-logs
        default.httpSettings.accessLogConfig:
        - gateway.kgateway.dev/ListenerPolicy/default/access-logs
        default.tcpSettings:
        - gateway.kgateway.dev/ListenerPolicy/default/access-logs
  name: listener~8000
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 8080
  filterChains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        accessLog:
        - name: envoy.access_loggers.file
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.access_loggers.file.v3.FileAccessLog
            logFormat:
              formatters:
              - name: envoy.formatter.req_without_query
                typedConfig:
                  '@type': type.googleapis.com/envoy.extensions.formatter.req_without_query.v3.ReqWithoutQuery
              - name: envoy.formatter.metadata
                typedConfig:
                  '@type': type.googleapis.com/envoy.extensions.formatter.metadata.v3.Metadata
              textFormatSource:
                inlineString: |
                  http %REQ(:METHOD)% %RESPONSE_CODE%
            path: /dev/stdout
        httpFilters:
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        mergeSlashes: true
        normalizePath: true
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: listener~8080
        statPrefix: http_8080
        useRemoteAddress: true
    name: listener~8080
  metadata:
    filterMetadata:
      merge.ListenerPolicy.gateway.kgateway.dev:
        default.httpSettings.accessLog:
        - gateway.kgateway.dev/ListenerPolicy/default/access-logs
        default.httpSettings.accessLogConfig:
        - gateway.kgateway.dev/ListenerPolicy/default/access-logs
        default.tcpSettings:
        - gateway.kgateway.dev/ListenerPolicy/default/access-logs
  name: listener~8080
Routes:
- ignorePortInHostMatching: true
  metadata:
    filterMetadata:
      merge.ListenerPolicy.gateway.kgateway.dev:
        default.httpSettings.accessLog:
        - gateway.kgateway.dev/ListenerPolicy/default/access-logs
        default.httpSettings.accessLogConfig:
        - gateway.kgateway.dev/ListenerPolicy/default/access-logs
        default.tcpSettings:
        - gateway.kgateway.dev/ListenerPolicy/default/access-logs
  name: listener~8080
  virtualHosts:
  - domains:
    - '*'
    name: listener~8080~*
    routes:
    - match:
        prefix: /
      name: listener~8080~*-route-0-httproute-example-http-route-default-0-0-matcher-0
      route:
        cluster: kube_default_http-svc_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
