Clusters:
- commonLbConfig:
    localityWeightedLbConfig: {}
  connectTimeout: 5s
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
  ignoreHealthOnHostRemoval: true
  name: kube_default_tcp-svc_8000
  type: EDS
Listeners:
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 8000
  filterChains:
  - filters:
    - name: envoy.filters.network.tcp_proxy
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
        accessLog:
        - name: envoy.access_loggers.file
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.access_loggers.file.v3.FileAccessLog
            logFormat:
              formatters:
              - name: envoy.formatter.req_without_query
                typedConfig:
                  '@type': type.googleapis.com/envoy.extensions.formatter.req_without_query.v3.ReqWithoutQuery
              - name: envoy.formatter.metadata
                typedConfig:
                  '@type': type.googleapis.com/envoy.extensions.formatter.metadata.v3.Metadata
              textFormatSource:
                inlineString: |
                  %DOWNSTREAM_REMOTE_ADDRESS%
            path: /dev/stdout
        cluster: kube_default_tcp-svc_8000
        statPrefix: tcp_8000_default_example-tcp-route
    name: listener~8000-default.example-tcp-route-rule-0
  metadata:
    filterMetadata:
      merge.ListenerPolicy.gateway.kgateway.dev:
        default.tcpSettings:
        - gateway.kgateway.dev/ListenerPolicy/default/gateway-wide-access-log
  name: listener~8000
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 8001
  filterChains:
  - filters:
    - name: envoy.filters.network.tcp_proxy
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
        accessLog:
        - name: envoy.access_loggers.file
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.access_loggers.file.v3.FileAccessLog
            logFormat:
              formatters:
              - name: envoy.formatter.req_without_query
                typedConfig:
                  '@type': type.googleapis.com/envoy.extensions.formatter.req_without_query.v3.ReqWithoutQuery
              - name: envoy.formatter.metadata
                typedConfig:
                  '@type': type.googleapis.com/envoy.extensions.formatter.metadata.v3.Metadata
              textFormatSource:
                inlineString: |
                  gateway-wide %DOWNSTREAM_REMOTE_ADDRESS%
            path: /dev/stdout
        cluster: kube_default_tcp-svc_8000
        statPrefix: tcp_8001_default_example-tcp-route-2
    name: listener~8001-default.example-tcp-route-2-rule-0
  metadata:
    filterMetadata:
      merge.ListenerPolicy.gateway.kgateway.dev:
        default.tcpSettings:
        - gateway.kgateway.dev/ListenerPolicy/default/gateway-wide-access-log
  name: listener~8001
