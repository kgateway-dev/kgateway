  connectTimeout: 5s
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
  ignoreHealthOnHostRemoval: true
  name: kube_default_primary_80
  type: EDS
- connectTimeout: 5s
  name: test-backend-plugin_default_example-svc_80
Listeners:
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 80
  filterChains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        httpFilters:
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        mergeSlashes: true
        normalizePath: true
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: listener~80
        statPrefix: http
        useRemoteAddress: true
    name: listener~80
  metadata:
    filterMetadata:
      merge.TrafficPolicy.gateway.kgateway.dev:
        requestMirror:
        - gateway.kgateway.dev/TrafficPolicy/default/gateway-request-mirror
  name: listener~80
Routes:
- ignorePortInHostMatching: true
  metadata:
    filterMetadata:
      merge.TrafficPolicy.gateway.kgateway.dev:
        requestMirror:
        - gateway.kgateway.dev/TrafficPolicy/default/gateway-request-mirror
  name: listener~80
  virtualHosts:
  - domains:
    - example.com
    name: listener~80~example_com
    routes:
    - match:
        path: /example.Service/Mirror
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            requestMirror:
            - gateway.kgateway.dev/TrafficPolicy/default/grpc-mirror-request-mirror
      name: listener~80~example_com-route-0-grpcroute-grpc-mirror-route-default-0-0-matcher-0
      route:
        cluster: kube_default_primary_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
        requestMirrorPolicies:
        - cluster: kube_default_mirror-one_80
          disableShadowHostSuffixAppend: true
    - match:
        pathSeparatedPrefix: /multi/two-mirrors
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            requestMirror:
            - gateway.kgateway.dev/TrafficPolicy/default/multi-rule-request-mirror
      name: listener~80~example_com-route-1-httproute-multi-rule-route-default-0-0-matcher-0
      route:
        cluster: kube_default_primary_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
        requestMirrorPolicies:
        - cluster: kube_default_mirror-one_80
          disableShadowHostSuffixAppend: true
        - cluster: kube_default_mirror-two_80
          disableShadowHostSuffixAppend: true
    - match:
        pathSeparatedPrefix: /multi/one-mirror
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            requestMirror:
            - gateway.kgateway.dev/TrafficPolicy/default/multi-rule-request-mirror
      name: listener~80~example_com-route-2-httproute-multi-rule-route-default-1-0-matcher-0
      route:
        cluster: kube_default_primary_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
        requestMirrorPolicies:
        - cluster: kube_default_mirror-one_80
          disableShadowHostSuffixAppend: true
    - match:
        pathSeparatedPrefix: /multi/no-mirror
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            requestMirror:
            - gateway.kgateway.dev/TrafficPolicy/default/multi-rule-request-mirror
      name: listener~80~example_com-route-3-httproute-multi-rule-route-default-2-0-matcher-0
      route:
        cluster: kube_default_primary_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
    - match:
        pathSeparatedPrefix: /override
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            requestMirror:
            - gateway.kgateway.dev/TrafficPolicy/default/override-route-request-mirror
      name: listener~80~example_com-route-4-httproute-override-route-default-0-0-matcher-0
      route:
        cluster: kube_default_primary_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
        requestMirrorPolicies:
        - cluster: kube_default_mirror-one_80
    - match:
        pathSeparatedPrefix: /rewrite
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            requestMirror:
            - gateway.kgateway.dev/TrafficPolicy/default/rewrite-route-request-mirror
      name: listener~80~example_com-route-5-httproute-rewrite-route-default-0-0-matcher-0
      route:
        cluster: kube_default_primary_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
        requestMirrorPolicies:
        - cluster: kube_default_mirror-one_80
          hostRewriteLiteral: shadow.example:8080
    - match:
        pathSeparatedPrefix: /inherit
      name: listener~80~example_com-route-6-httproute-inherit-route-default-0-0-matcher-0
      route:
        cluster: kube_default_primary_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
        requestMirrorPolicies:
        - cluster: kube_default_mirror-one_80
          disableShadowHostSuffixAppend: true
