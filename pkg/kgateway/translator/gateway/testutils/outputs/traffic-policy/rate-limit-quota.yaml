  typedExtensionProtocolOptions:
    envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
      '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
      explicitHttpConfig:
        http2ProtocolOptions: {}
- connectTimeout: 5s
  name: test-backend-plugin_default_example-svc_80
Listeners:
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 80
  filterChains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        httpFilters:
        - name: ratelimit/quota/default/rlqs
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.rate_limit_quota.v3.RateLimitQuotaFilterConfig
            bucketMatchers:
              matcherList:
                matchers:
                - onMatch:
                    action:
                      name: rate_limit_quota
                      typedConfig:
                        '@type': type.googleapis.com/envoy.extensions.filters.http.rate_limit_quota.v3.RateLimitQuotaBucketSettings
                        bucketIdBuilder:
                          bucketIdBuilder:
                            route:
                              stringValue: fast
                            tenant:
                              customValue:
                                name: request-header
                                typedConfig:
                                  '@type': type.googleapis.com/envoy.type.matcher.v3.HttpRequestHeaderMatchInput
                                  headerName: x-tenant-id
                        denyResponseSettings:
                          httpStatus:
                            code: ServiceUnavailable
                        expiredAssignmentBehavior:
                          expiredAssignmentBehaviorTimeout: 30s
                          reuseLastAssignment: {}
                        noAssignmentBehavior:
                          fallbackRateLimit:
                            blanketRule: DENY_ALL
                        reportingInterval: 2s
                  predicate:
                    singlePredicate:
                      customMatch:
                        name: envoy.matching.matchers.cel_matcher
                        typedConfig:
                          '@type': type.googleapis.com/xds.type.matcher.v3.CelMatcher
                          exprMatch:
                            celExprParsed:
                              expr:
                                callExpr:
                                  args:
                                  - id: "2"
                                    selectExpr:
                                      field: route_name
                                      operand:
                                        id: "1"
                                        identExpr:
                                          name: xds
                                  - constExpr:
                                      stringValue: listener~80~example_com-route-0-httproute-example-route-default-0-0-fast-matcher-0
                                    id: "4"
                                  function: _==_
                                id: "3"
                      input:
                        name: envoy.matching.inputs.cel_data_input
                        typedConfig:
                          '@type': type.googleapis.com/xds.type.matcher.v3.HttpAttributesCelMatchInput
                - onMatch:
                    action:
                      name: rate_limit_quota
                      typedConfig:
                        '@type': type.googleapis.com/envoy.extensions.filters.http.rate_limit_quota.v3.RateLimitQuotaBucketSettings
                        bucketIdBuilder:
                          bucketIdBuilder:
                            route:
                              stringValue: slow
                        denyResponseSettings:
                          httpStatus:
                            code: TooManyRequests
                        expiredAssignmentBehavior:
                          expiredAssignmentBehaviorTimeout: 20s
                          fallbackRateLimit:
                            blanketRule: DENY_ALL
                        noAssignmentBehavior:
                          fallbackRateLimit:
                            blanketRule: ALLOW_ALL
                        reportingInterval: 5s
                  predicate:
                    singlePredicate:
                      customMatch:
                        name: envoy.matching.matchers.cel_matcher
                        typedConfig:
                          '@type': type.googleapis.com/xds.type.matcher.v3.CelMatcher
                          exprMatch:
                            celExprParsed:
                              expr:
                                callExpr:
                                  args:
                                  - id: "2"
                                    selectExpr:
                                      field: route_name
                                      operand:
                                        id: "1"
                                        identExpr:
                                          name: xds
                                  - constExpr:
                                      stringValue: listener~80~example_com-route-1-httproute-example-route-default-1-0-slow-matcher-0
                                    id: "4"
                                  function: _==_
                                id: "3"
                      input:
                        name: envoy.matching.inputs.cel_data_input
                        typedConfig:
                          '@type': type.googleapis.com/xds.type.matcher.v3.HttpAttributesCelMatchInput
                - onMatch:
                    action:
                      name: rate_limit_quota
                      typedConfig:
                        '@type': type.googleapis.com/envoy.extensions.filters.http.rate_limit_quota.v3.RateLimitQuotaBucketSettings
                        bucketIdBuilder:
                          bucketIdBuilder:
                            route:
                              stringValue: default
                        denyResponseSettings:
                          httpStatus:
                            code: TooManyRequests
                        noAssignmentBehavior:
                          fallbackRateLimit:
                            blanketRule: ALLOW_ALL
                        reportingInterval: 5s
                  predicate:
                    singlePredicate:
                      customMatch:
                        name: envoy.matching.matchers.cel_matcher
                        typedConfig:
                          '@type': type.googleapis.com/xds.type.matcher.v3.CelMatcher
                          exprMatch:
                            celExprParsed:
                              expr:
                                callExpr:
                                  args:
                                  - id: "2"
                                    selectExpr:
                                      field: route_name
                                      operand:
                                        id: "1"
                                        identExpr:
                                          name: xds
                                  - constExpr:
                                      stringValue: listener~80~example_com-route-2-httproute-example-route-default-2-0-other-matcher-0
                                    id: "4"
                                  function: _==_
                                id: "3"
                      input:
                        name: envoy.matching.inputs.cel_data_input
                        typedConfig:
                          '@type': type.googleapis.com/xds.type.matcher.v3.HttpAttributesCelMatchInput
            domain: example
            rlqsServer:
              envoyGrpc:
                clusterName: kube_default_rlqs_18081
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        mergeSlashes: true
        normalizePath: true
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: listener~80
        statPrefix: http
        useRemoteAddress: true
    name: listener~80
  metadata:
    filterMetadata:
      merge.TrafficPolicy.gateway.kgateway.dev:
        rateLimit.quota:
        - gateway.kgateway.dev/TrafficPolicy/default/quota-gateway
  name: listener~80
Routes:
- ignorePortInHostMatching: true
  metadata:
    filterMetadata:
      merge.TrafficPolicy.gateway.kgateway.dev:
        rateLimit.quota:
        - gateway.kgateway.dev/TrafficPolicy/default/quota-gateway
  name: listener~80
  virtualHosts:
  - domains:
    - example.com
    name: listener~80~example_com
    routes:
    - match:
        path: /fast
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            rateLimit.quota:
            - gateway.kgateway.dev/TrafficPolicy/default/quota-fast
      name: listener~80~example_com-route-0-httproute-example-route-default-0-0-fast-matcher-0
      route:
        cluster: kube_default_example-svc_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
    - match:
        pathSeparatedPrefix: /slow
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            rateLimit.quota:
            - gateway.kgateway.dev/TrafficPolicy/default/quota-slow
      name: listener~80~example_com-route-1-httproute-example-route-default-1-0-slow-matcher-0
      route:
        cluster: kube_default_example-svc_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
    - match:
        prefix: /
      name: listener~80~example_com-route-2-httproute-example-route-default-2-0-other-matcher-0
      route:
        cluster: kube_default_example-svc_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
