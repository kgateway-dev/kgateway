Listeners:
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 8080
  filterChains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        httpFilters:
        - disabled: true
          name: global_disable/ext_auth
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.set_metadata.v3.Config
            metadata:
            - metadataNamespace: dev.kgateway.disable_ext_auth
              value:
                disable: true
        - disabled: true
          name: envoy.filters.http.decompressor
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.decompressor.v3.Decompressor
            decompressorLibrary:
              name: envoy.compression.gzip.decompressor
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.compression.gzip.decompressor.v3.Gzip
            responseDirectionConfig:
              commonConfig:
                enabled:
                  defaultValue: false
        - disabled: true
          name: envoy.filters.http.buffer
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
            maxRequestBytes: 4294967295
        - disabled: true
          name: ext_auth/default/extauth
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
            filterEnabledMetadata:
              filter: dev.kgateway.disable_ext_auth
              invert: true
              path:
              - key: disable
              value:
                boolMatch: true
            grpcService:
              envoyGrpc:
                clusterName: kube_default_ext-authz_9000
            statusOnError:
              code: Forbidden
        - disabled: true
          name: ext_auth_enabled
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
            dynamicModuleConfig:
              name: rust_module
            filterConfig:
              '@type': type.googleapis.com/google.protobuf.StringValue
              value: '{}'
            filterName: rustformation
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        mergeSlashes: true
        normalizePath: true
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: listener~8080
        statPrefix: http
        useRemoteAddress: true
    name: listener~8080
  name: listener~8080
Routes:
- ignorePortInHostMatching: true
  name: listener~8080
  virtualHosts:
  - domains:
    - test.com
    name: listener~8080~test_com
    routes:
    - match:
        pathSeparatedPrefix: /decompressed
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            buffer:
            - gateway.kgateway.dev/TrafficPolicy/default/buffer-decompressed
            decompression:
            - gateway.kgateway.dev/TrafficPolicy/default/buffer-decompressed
      name: listener~8080~test_com-route-0-httproute-test-default-2-0-decompressed-matcher-0
      route:
        cluster: kube_default_test_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
      typedPerFilterConfig:
        envoy.filters.http.buffer:
          '@type': type.googleapis.com/envoy.extensions.filters.http.buffer.v3.BufferPerRoute
          buffer:
            maxRequestBytes: 2048
        envoy.filters.http.decompressor:
          '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
          config: {}
    - match:
        pathSeparatedPrefix: /before-auth
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            buffer:
            - gateway.kgateway.dev/TrafficPolicy/default/buffer-before-auth
            extAuth:
            - gateway.kgateway.dev/TrafficPolicy/default/buffer-before-auth
      name: listener~8080~test_com-route-1-httproute-test-default-0-0-before-auth-matcher-0
      route:
        cluster: kube_default_test_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
      typedPerFilterConfig:
        envoy.filters.http.buffer:
          '@type': type.googleapis.com/envoy.extensions.filters.http.buffer.v3.BufferPerRoute
          buffer:
            maxRequestBytes: 1024
        ext_auth/default/extauth:
          '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
          config: {}
        ext_auth_enabled:
          '@type': type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilterPerRoute
          dynamicModuleConfig:
            name: rust_module
          filterConfig:
            '@type': type.googleapis.com/google.protobuf.StringValue
            value: '{"request":{"body":{"parseAs":"None"},"dynamicMetadata":[{"namespace":"dev.kgateway.auth_policy","key":"auth_succeeded","value":{"stringValue":"true"}}]},"response":{"body":{"parseAs":"None"}}}'
          filterName: rustformation
          perRouteConfigName: rustformation
    - match:
        pathSeparatedPrefix: /default
      metadata:
        filterMetadata:
          merge.TrafficPolicy.gateway.kgateway.dev:
            buffer:
            - gateway.kgateway.dev/TrafficPolicy/default/buffer-default-stage
      name: listener~8080~test_com-route-2-httproute-test-default-1-0-default-stage-matcher-0
      route:
        cluster: kube_default_test_80
        clusterNotFoundResponseCode: INTERNAL_SERVER_ERROR
      typedPerFilterConfig:
        envoy.filters.http.buffer:
          '@type': type.googleapis.com/envoy.extensions.filters.http.buffer.v3.BufferPerRoute
          buffer:
            maxRequestBytes: 65536
