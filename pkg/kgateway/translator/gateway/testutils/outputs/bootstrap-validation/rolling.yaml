Clusters:
- commonLbConfig:
    localityWeightedLbConfig: {}
  connectTimeout: 5s
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
  ignoreHealthOnHostRemoval: true
  name: kube_gwtest_example-svc_80
  type: EDS
Listeners:
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 8080
  filterChains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        httpFilters:
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        mergeSlashes: true
        normalizePath: true
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: listener~8080
        statPrefix: http_8080
        useRemoteAddress: true
    name: listener~8080
  name: listener~8080
Routes:
- ignorePortInHostMatching: true
  name: listener~8080
  virtualHosts:
  - domains:
    - '*'
    name: listener~8080~*
Statuses:
  gateways:
    gwtest/example-gateway:
      conditions:
      - lastTransitionTime: null
        message: 'Some listeners are not programmed: bootstrap-port: invalid port
          9000 in listener: the proxy bootstrap, with the GatewayParameters bootstrap
          patches applied, listens on it: port is reserved'
        reason: ListenersNotValid
        status: "True"
        type: Accepted
      - lastTransitionTime: null
        message: Successfully programmed Gateway
        reason: Programmed
        status: "True"
        type: Programmed
      - lastTransitionTime: null
        message: Successfully resolved all Gateway references
        reason: ResolvedRefs
        status: "True"
        type: ResolvedRefs
      listeners:
      - attachedRoutes: 1
        conditions:
        - lastTransitionTime: null
          message: Successfully accepted Listener
          reason: Accepted
          status: "True"
          type: Accepted
        - lastTransitionTime: null
          message: Successfully verified that Listener has no conflicts
          reason: NoConflicts
          status: "False"
          type: Conflicted
        - lastTransitionTime: null
          message: Successfully resolved all references
          reason: ResolvedRefs
          status: "True"
          type: ResolvedRefs
        - lastTransitionTime: null
          message: Successfully programmed Listener
          reason: Programmed
          status: "True"
          type: Programmed
        name: http
        supportedKinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        - group: gateway.networking.k8s.io
          kind: GRPCRoute
      - attachedRoutes: 0
        conditions:
        - lastTransitionTime: null
          message: 'invalid port 9000 in listener: the proxy bootstrap, with the GatewayParameters
            bootstrap patches applied, listens on it: port is reserved'
          reason: Invalid
          status: "True"
          type: Conflicted
        - lastTransitionTime: null
          message: 'invalid port 9000 in listener: the proxy bootstrap, with the GatewayParameters
            bootstrap patches applied, listens on it: port is reserved'
          reason: Invalid
          status: "False"
          type: Accepted
        - lastTransitionTime: null
          message: 'invalid port 9000 in listener: the proxy bootstrap, with the GatewayParameters
            bootstrap patches applied, listens on it: port is reserved'
          reason: Invalid
          status: "False"
          type: Programmed
        - lastTransitionTime: null
          message: Successfully resolved all references
          reason: ResolvedRefs
          status: "True"
          type: ResolvedRefs
        name: bootstrap-port
        supportedKinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        - group: gateway.networking.k8s.io
          kind: GRPCRoute
  httpRoutes:
    gwtest/long-regex:
      parents:
      - conditions:
        - lastTransitionTime: null
          message: |-
            Dropped Rule (0): invalid matcher configuration
            validation failed: rejected by proxy pod example-gateway-old-a, which runs an earlier bootstrap until its rollout completes: invalid xds configuration: error initializing configuration '/dev/fd/0': regex '/(abcdefgh){20}' RE2 program size of 205 > max program size of 100 set for the error level threshold. Increase configured max program size if necessary.
          reason: RouteRuleDropped
          status: "False"
          type: kgateway.dev/Programmed
        - lastTransitionTime: null
          message: Successfully accepted Route
          reason: Accepted
          status: "True"
          type: Accepted
        - lastTransitionTime: null
          message: Successfully resolved all references
          reason: ResolvedRefs
          status: "True"
          type: ResolvedRefs
        controllerName: kgateway
        parentRef:
          group: ""
          kind: ""
          name: example-gateway
          sectionName: http
