        name: udp-weighted
        supportedKinds:
        - group: gateway.networking.k8s.io
          kind: UDPRoute
  policies:
    BackendConfigPolicy/default/udp-svc-a-policy:
      ancestors:
      - ancestorRef:
          group: ""
          kind: Service
          name: udp-svc-a
          namespace: default
        conditions:
        - lastTransitionTime: null
          message: Policy accepted
          reason: Valid
          status: "True"
          type: Accepted
        - lastTransitionTime: null
          message: Attached to all targets
          reason: Attached
          status: "True"
          type: Attached
        controllerName: kgateway.dev/kgateway
  udpRoutes:
    default/single-backend:
      parents:
      - conditions:
        - lastTransitionTime: null
          message: ""
