Clusters:
- commonLbConfig: {}
  connectTimeout: 5s
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
  ignoreHealthOnHostRemoval: true
  loadBalancingPolicy:
    policies:
    - typedExtensionConfig:
        name: envoy.load_balancing_policies.ring_hash
        typedConfig:
          '@type': type.googleapis.com/envoy.extensions.load_balancing_policies.ring_hash.v3.RingHash
          consistentHashingLbConfig:
            hashPolicy:
            - connectionProperties:
                sourceIp: true
            - header:
                headerName: x-user
  name: kube_default_udp-svc-a_8080
  type: EDS
  upstreamConnectionOptions:
    tcpKeepalive:
      keepaliveInterval: 5
      keepaliveProbes: 3
      keepaliveTime: 30
- commonLbConfig:
    localityWeightedLbConfig: {}
  connectTimeout: 5s
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
  ignoreHealthOnHostRemoval: true
  name: kube_default_udp-svc-b_8080
  type: EDS
ExtraClusters:
- commonLbConfig:
    localityWeightedLbConfig: {}
  connectTimeout: 5s
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
  ignoreHealthOnHostRemoval: true
  name: udpagg_default_weighted
  type: EDS
Listeners:
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 8080
      protocol: UDP
  listenerFilters:
  - name: envoy.filters.udp_listener.udp_proxy
    typedConfig:
      '@type': type.googleapis.com/envoy.extensions.filters.udp.udp_proxy.v3.UdpProxyConfig
      hashPolicies:
      - sourceIp: true
      idleTimeout: 60s
      matcher:
        onNoMatch:
          action:
            name: route
            typedConfig:
              '@type': type.googleapis.com/envoy.extensions.filters.udp.udp_proxy.v3.Route
              cluster: kube_default_udp-svc-a_8080
      statPrefix: listener~8080-default.single-backend-rule-0
  name: listener~8080
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 8081
      protocol: UDP
  listenerFilters:
  - name: envoy.filters.udp_listener.udp_proxy
    typedConfig:
      '@type': type.googleapis.com/envoy.extensions.filters.udp.udp_proxy.v3.UdpProxyConfig
      idleTimeout: 60s
      matcher:
        onNoMatch:
          action:
            name: route
            typedConfig:
              '@type': type.googleapis.com/envoy.extensions.filters.udp.udp_proxy.v3.Route
              cluster: udpagg_default_weighted
      statPrefix: listener~8081-default.weighted-rule-0
  name: listener~8081
