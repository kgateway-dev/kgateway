Clusters:
- connectTimeout: 5s
  loadAssignment:
    clusterName: backend_default_static-backend_0
    endpoints:
    - lbEndpoints:
      - endpoint:
          address:
            socketAddress:
              address: 10.0.0.10
              portValue: 9000
          healthCheckConfig:
            hostname: 10.0.0.10
          hostname: 10.0.0.10
  name: backend_default_static-backend_0
  type: STATIC
- commonLbConfig:
    localityWeightedLbConfig: {}
  connectTimeout: 5s
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
  ignoreHealthOnHostRemoval: true
  name: kube_default_example-udp-svc_8080
  type: EDS
ExtraClusters:
- commonLbConfig:
    localityWeightedLbConfig: {}
  connectTimeout: 5s
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
  ignoreHealthOnHostRemoval: true
  name: udpagg_default_weighted-route
  type: EDS
Listeners:
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 8080
      protocol: UDP
  listenerFilters:
  - name: envoy.filters.udp_listener.udp_proxy
    typedConfig:
      '@type': type.googleapis.com/envoy.extensions.filters.udp.udp_proxy.v3.UdpProxyConfig
      matcher:
        onNoMatch:
          action:
            name: route
            typedConfig:
              '@type': type.googleapis.com/envoy.extensions.filters.udp.udp_proxy.v3.Route
              cluster: udpagg_default_weighted-route
      statPrefix: listener~8080-default.weighted-route-rule-0
  name: listener~8080
- address:
    socketAddress:
      address: '::'
      ipv4Compat: true
      portValue: 8081
      protocol: UDP
  listenerFilters:
  - name: envoy.filters.udp_listener.udp_proxy
    typedConfig:
      '@type': type.googleapis.com/envoy.extensions.filters.udp.udp_proxy.v3.UdpProxyConfig
      matcher:
        onNoMatch:
          action:
            name: route
            typedConfig:
              '@type': type.googleapis.com/envoy.extensions.filters.udp.udp_proxy.v3.Route
              cluster: backend_default_static-backend_0
      statPrefix: listener~8081-default.single-route-rule-0
  name: listener~8081
