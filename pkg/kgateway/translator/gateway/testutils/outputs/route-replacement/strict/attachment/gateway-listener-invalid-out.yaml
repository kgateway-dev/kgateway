            response.
        status: 500
      match:
        prefix: /
- ignorePortInHostMatching: true
  name: listener~8080
  virtualHosts:
  - domains:
    - www.example.com
    name: listener~8080~www_example_com
    routes:
    - directResponse:
        body:
