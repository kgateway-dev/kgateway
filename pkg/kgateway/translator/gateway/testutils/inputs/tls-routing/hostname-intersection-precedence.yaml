# TLSRoutes whose hostnames intersect with the listener hostname to the same
# SNI domain are resolved by the specificity of their own hostnames, so the
# newer exact-hostname route owns the SNI domain and the older wildcard route
# is reported as conflicted. The oldest route has no hostnames, so it is the
# least specific and is conflicted too; it is not translated, but its missing
# backend is still reported with ResolvedRefs=False.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: tls
    protocol: TLS
    port: 8443
    hostname: abc.example.com
    tls:
      mode: Passthrough
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: wildcard-older
  creationTimestamp: "2026-01-01T00:00:00Z"
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "*.example.com"
  rules:
  - backendRefs:
    - name: wildcard-svc
      port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: exact-newer
  creationTimestamp: "2026-02-01T00:00:00Z"
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "abc.example.com"
  rules:
  - backendRefs:
    - name: exact-svc
      port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: no-hostnames-oldest
  creationTimestamp: "2025-01-01T00:00:00Z"
spec:
  parentRefs:
  - name: example-gateway
  rules:
  - backendRefs:
    - name: missing-svc
      port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: wildcard-svc
spec:
  ports:
  - protocol: TCP
    port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: exact-svc
spec:
  ports:
  - protocol: TCP
    port: 443
