# A Gateway-wide ListenerPolicy overrides the Gateway's spec.tls.frontend validation, both the default
# (port 8443) and perPort (port 9443): every listener trusts gateway-wide-ca-cert and requires a client
# certificate.
# The web listener has an optional policy of its own whose CA does not exist. It still replaces the
# Gateway-wide policy, so the listener keeps the frontend validation (frontend-ca-cert, optional) and
# reports the missing CA certificate.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: default
spec:
  gatewayClassName: kgateway
  tls:
    frontend:
      default:
        validation:
          mode: AllowInsecureFallback
          caCertificateRefs:
          - name: frontend-ca-cert
            kind: Secret
            group: ""
      perPort:
      - port: 9443
        tls:
          validation:
            mode: AllowInsecureFallback
            caCertificateRefs:
            - name: perport-ca-cert
              kind: Secret
              group: ""
  listeners:
  - name: api
    protocol: HTTPS
    port: 8443
    hostname: api.example.com
    tls:
      mode: Terminate
      certificateRefs:
      - name: server-cert
  - name: web
    protocol: HTTPS
    port: 8443
    hostname: web.example.com
    tls:
      mode: Terminate
      certificateRefs:
      - name: server-cert
  - name: admin
    protocol: HTTPS
    port: 9443
    hostname: admin.example.com
    tls:
      mode: Terminate
      certificateRefs:
      - name: server-cert
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: gateway-mtls
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: example-gateway
  default:
    clientCertificateValidation:
      mode: Require
      caCertificateRefs:
      - name: gateway-wide-ca-cert
        kind: Secret
        group: ""
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: web-mtls
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: example-gateway
    sectionName: web
  default:
    clientCertificateValidation:
      mode: Optional
      caCertificateRefs:
      - name: missing-ca-cert
        kind: Secret
        group: ""
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route
  namespace: default
spec:
  parentRefs:
  - name: example-gateway
  rules:
  - backendRefs:
    - name: example-svc
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: example-svc
  namespace: default
spec:
  selector:
    app: example
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: v1
kind: Secret
metadata:
  name: server-cert
  namespace: default
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-wide-ca-cert
  namespace: default
type: Opaque
data:
  ca.crt: 
---
apiVersion: v1
kind: Secret
metadata:
  name: frontend-ca-cert
  namespace: default
type: Opaque
data:
  ca.crt: 
---
apiVersion: v1
kind: Secret
metadata:
  name: perport-ca-cert
  namespace: default
type: Opaque
data:
  ca.crt: 
