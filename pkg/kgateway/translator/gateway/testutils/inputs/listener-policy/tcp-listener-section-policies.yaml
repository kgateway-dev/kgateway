apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: tcp
    protocol: TCP
    port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: example-tcp-route
spec:
  parentRefs:
  - name: example-gateway
    sectionName: tcp
  rules:
  - backendRefs:
    - name: tcp-svc
      port: 8000
---
# TrafficPolicy has no effect on a TCP listener, so it must not be reported as attached to it.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: http-only-policy
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: example-gateway
    sectionName: tcp
  timeouts:
    request: 5s
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: tcp-listener-access-log
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: example-gateway
    sectionName: tcp
  default:
    tcpSettings:
      accessLog:
      - fileSink:
          path: /dev/stdout
          stringFormat: "%DOWNSTREAM_REMOTE_ADDRESS%\n"
---
apiVersion: v1
kind: Service
metadata:
  name: tcp-svc
spec:
  selector:
    test: test
  ports:
  - protocol: TCP
    port: 8000
