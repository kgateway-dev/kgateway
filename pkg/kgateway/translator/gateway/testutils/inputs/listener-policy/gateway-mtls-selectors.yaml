# ListenerPolicies that select the Gateway by label (targetSelectors) apply to all of its listeners.
# CA certificate refs without a namespace resolve in each policy's own namespace:
# - local-mtls lives in the Gateway's namespace (infra) and refers to local-ca-cert there
# - global-mtls lives in the global policy namespace (kgateway-system) and refers to global-ca-cert,
#   which exists only there
# Both CAs are trusted and the listener requires a client certificate (global-mtls is Require).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: infra
  labels:
    mtls: enabled
spec:
  gatewayClassName: kgateway
  listeners:
  - name: https
    protocol: HTTPS
    port: 8443
    hostname: example.com
    tls:
      mode: Terminate
      certificateRefs:
      - name: server-cert
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: local-mtls
  namespace: infra
spec:
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: Gateway
    matchLabels:
      mtls: enabled
  default:
    clientCertificateValidation:
      mode: Optional
      caCertificateRefs:
      - name: local-ca-cert
        kind: Secret
        group: ""
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: global-mtls
  namespace: kgateway-system
spec:
  targetSelectors:
  - group: gateway.networking.k8s.io
    kind: Gateway
    matchLabels:
      mtls: enabled
  default:
    clientCertificateValidation:
      mode: Require
      caCertificateRefs:
      - name: global-ca-cert
        kind: Secret
        group: ""
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route
  namespace: infra
spec:
  parentRefs:
  - name: example-gateway
  rules:
  - backendRefs:
    - name: example-svc
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: example-svc
  namespace: infra
spec:
  selector:
    app: example
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: v1
kind: Secret
metadata:
  name: server-cert
  namespace: infra
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
apiVersion: v1
kind: Secret
metadata:
  name: local-ca-cert
  namespace: infra
type: Opaque
data:
  ca.crt: 
---
apiVersion: v1
kind: Secret
metadata:
  name: global-ca-cert
  namespace: kgateway-system
type: Opaque
data:
  ca.crt: 
