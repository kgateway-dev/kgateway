apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: tenant-a-tls
    protocol: TLS
    hostname: tenant-a.example.com
    port: 8443
    tls:
      mode: Passthrough
  - name: tenant-b-tls
    protocol: TLS
    hostname: tenant-b.example.com
    port: 8443
    tls:
      mode: Passthrough
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: gateway-wide
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: example-gateway
  default:
    transportSocketConnectTimeout: 5s
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: tenant-a-override
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: example-gateway
    sectionName: tenant-a-tls
  default:
    transportSocketConnectTimeout: 10s
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: tenant-a-route
spec:
  parentRefs:
  - name: example-gateway
    sectionName: tenant-a-tls
  hostnames:
  - tenant-a.example.com
  rules:
  - backendRefs:
    - name: example-svc
      port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: tenant-b-route
spec:
  parentRefs:
  - name: example-gateway
    sectionName: tenant-b-tls
  hostnames:
  - tenant-b.example.com
  rules:
  - backendRefs:
    - name: example-svc
      port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: example-svc
spec:
  selector:
    app: example
  ports:
  - port: 443
    protocol: TCP
