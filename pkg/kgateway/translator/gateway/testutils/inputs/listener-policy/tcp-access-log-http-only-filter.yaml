apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: tcp
    protocol: TCP
    port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: example-tcp-route
spec:
  parentRefs:
  - name: example-gateway
  rules:
  - backendRefs:
    - name: tcp-svc
      port: 8000
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: http-only-filter
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: example-gateway
  default:
    tcpSettings:
      accessLog:
      - fileSink:
          path: /dev/stdout
          stringFormat: "%DOWNSTREAM_REMOTE_ADDRESS%\n"
        filter:
          statusCodeFilter:
            op: GE
            value: 400
---
apiVersion: v1
kind: Service
metadata:
  name: tcp-svc
spec:
  selector:
    test: test
  ports:
  - protocol: TCP
    port: 8000
