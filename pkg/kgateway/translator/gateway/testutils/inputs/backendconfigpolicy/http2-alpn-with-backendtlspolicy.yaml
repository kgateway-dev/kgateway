# The Service has no appProtocol, so the BackendTLSPolicy lets Envoy negotiate HTTP/2 or HTTP/1.1
# via ALPN. The BackendConfigPolicy http2ProtocolOptions apply when HTTP/2 is negotiated.
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: example-gateway
spec:
  gatewayClassName: kgateway
  listeners:
  - protocol: HTTP
    port: 8080
    name: http
    allowedRoutes:
      namespaces:
        from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-route
spec:
  parentRefs:
  - name: example-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: httpbin
      port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  labels:
    app: httpbin
    service: httpbin
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: httpbin
---
kind: BackendConfigPolicy
apiVersion: gateway.kgateway.dev/v1alpha1
metadata:
  name: httpbin-policy
spec:
  targetRefs:
    - name: httpbin
      group: ""
      kind: Service
  http2ProtocolOptions:
    maxConcurrentStreams: 100
    initialStreamWindowSize: 64Ki
    initialConnectionWindowSize: 64Ki
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: httpbin-tls-policy
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: httpbin
  validation:
    hostname: "from-btp.example.com"
    wellKnownCACertificates: System
