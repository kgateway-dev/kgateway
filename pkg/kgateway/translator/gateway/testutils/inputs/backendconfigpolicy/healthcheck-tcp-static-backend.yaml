apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: default
spec:
  gatewayClassName: kgateway
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route
  namespace: default
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "example.com"
  rules:
  - backendRefs:
    - group: gateway.kgateway.dev
      kind: Backend
      name: static-ip-backend
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: static-ip-backend
  namespace: default
spec:
  type: Static
  static:
    hosts:
    - host: 10.0.0.1
      port: 8080
    - host: 10.0.0.2
      port: 8080
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: static-ip-backend-tcp-hc-policy
  namespace: default
spec:
  targetRefs:
  - name: static-ip-backend
    group: gateway.kgateway.dev
    kind: Backend
  healthCheck:
    healthyThreshold: 2
    unhealthyThreshold: 3
    interval: 10s
    timeout: 2s
    # No send payload: Envoy treats an empty payload as a connect-only check,
    # which is the only active check available for Static backends that expose
    # no HTTP or gRPC health endpoint on the port serving traffic.
    tcp: {}
