# Routes whose hostnames intersect with the listener hostname to the same
# virtual host are ordered by the specificity of their own hostnames before
# their matches, so the newer exact-hostname route takes precedence over the
# older wildcard route, even for a more specific path. Routes without
# hostnames are the least specific, so the no-hostnames /api route sorts after
# every route with hostnames, even ones with shorter paths.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 8080
    hostname: abc.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wildcard-older
  creationTimestamp: "2026-01-01T00:00:00Z"
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "*.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /foo
    backendRefs:
    - name: wildcard-svc
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catch-all-oldest
  creationTimestamp: "2025-01-01T00:00:00Z"
spec:
  parentRefs:
  - name: example-gateway
  rules:
  - backendRefs:
    - name: catch-all-svc
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: exact-newer
  creationTimestamp: "2026-02-01T00:00:00Z"
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "*.com"
  - "abc.example.com"
  rules:
  - backendRefs:
    - name: exact-svc
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: no-hostnames-api
  creationTimestamp: "2025-06-01T00:00:00Z"
spec:
  parentRefs:
  - name: example-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: catch-all-svc
      port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: wildcard-svc
spec:
  ports:
  - protocol: TCP
    port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: catch-all-svc
spec:
  ports:
  - protocol: TCP
    port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: exact-svc
spec:
  ports:
  - protocol: TCP
    port: 8080
