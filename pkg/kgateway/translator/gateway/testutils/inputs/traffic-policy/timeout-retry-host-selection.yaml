apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: example-svc
spec:
  selector:
    test: test
  ports:
  - protocol: HTTP
    port: 80
    targetPort: test
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route-retry-host-selection
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "host-selection.com"
  rules:
  - backendRefs:
    - name: example-svc
      port: 80
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: example-route-retry-host-selection
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: example-route-retry-host-selection
  retry:
    retryOn:
    - connect-failure
    attempts: 2
    statusCodes:
    - 503
    backoffBaseInterval: 50ms
    hostSelectionAttempts: 5
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: example-gateway-retry-host-selection
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: example-gateway
    sectionName: http
  retry:
    attempts: 3
    retryOn:
    - gateway-error
    hostSelectionAttempts: 7
