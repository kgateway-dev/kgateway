apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: infra
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "example.com"
---
# Only the canary backendRef attaches ext-auth. Its config must be written on
# the canary weighted cluster, not at route scope where the stable cluster
# would inherit it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weighted-route
  namespace: infra
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /weighted
    backendRefs:
    - name: canary-svc
      port: 80
      weight: 10
      filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.kgateway.dev
          kind: TrafficPolicy
          name: canary-extauth
    - name: stable-svc
      port: 80
      weight: 90
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: canary-extauth
  namespace: infra
spec:
  extAuth:
    extensionRef:
      name: grpc-extauth
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: grpc-extauth
  namespace: infra
spec:
  type: ExtAuth
  extAuth:
    metadataContextNamespaces:
    - dev.example.custom
    grpcService:
      backendRef:
        name: grpc-ext-authz
        port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: canary-svc
  namespace: infra
spec:
  selector:
    app: canary
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: stable-svc
  namespace: infra
spec:
  selector:
    app: stable
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  namespace: infra
  name: grpc-ext-authz
spec:
  ports:
  - port: 9000
    targetPort: 9000
    protocol: TCP
    appProtocol: kubernetes.io/h2c
  selector:
    app: ext-authz
