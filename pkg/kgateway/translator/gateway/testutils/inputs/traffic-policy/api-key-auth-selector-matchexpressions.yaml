apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: default
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "example.com"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route
  namespace: default
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "example.com"
  rules:
  - backendRefs:
    - name: example-svc
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /foo
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.kgateway.dev
        kind: TrafficPolicy
        name: api-key-auth-selector
---
# Matches: app=api-keys (In) AND tier != dev (NotIn)
apiVersion: v1
kind: Secret
metadata:
  name: api-keys-1
  namespace: default
  labels:
    app: api-keys
    tier: prod
type: Opaque
data:
  client1: ay0xMjM=
---
# Excluded: tier=dev matches the NotIn exclusion
apiVersion: v1
kind: Secret
metadata:
  name: api-keys-2
  namespace: default
  labels:
    app: api-keys
    tier: dev
type: Opaque
data:
  client2: ay00NTY=
---
# Excluded: app doesn't match the In requirement
apiVersion: v1
kind: Secret
metadata:
  name: api-keys-3
  namespace: default
  labels:
    app: other
    tier: prod
type: Opaque
data:
  client3: ay03ODk=
---
# TrafficPolicy with API key authentication using SecretSelector with matchExpressions
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: api-key-auth-selector
  namespace: default
spec:
  targetRefs:
  - name: example-route
    kind: HTTPRoute
    group: gateway.networking.k8s.io
  apiKeyAuth:
    keySources:
    - header: "x-api-key"
    forwardCredential: false
    clientIdHeader: "x-authenticated-client"
    secretSelector:
      matchExpressions:
      - key: app
        operator: In
        values:
        - api-keys
      - key: tier
        operator: NotIn
        values:
        - dev
---
# Test service
apiVersion: v1
kind: Service
metadata:
  name: example-svc
  namespace: default
spec:
  selector:
    app: example
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
