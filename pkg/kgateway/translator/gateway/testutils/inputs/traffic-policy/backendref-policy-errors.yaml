apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: infra
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: basic-extauth
  namespace: infra
spec:
  type: ExtAuth
  extAuth:
    grpcService:
      backendRef:
        name: ext-authz
        port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route
  namespace: infra
spec:
  parentRefs:
  - name: example-gateway
  rules:
  # A backendRef policy whose GatewayExtension is missing must fail closed.
  - matches:
    - path:
        type: PathPrefix
        value: /broken-policy
    backendRefs:
    - name: example-svc
      port: 80
      filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.kgateway.dev
          kind: TrafficPolicy
          name: extauth-missing-extension
  # A backendRef ExtensionRef to a policy that does not exist must fail closed.
  - matches:
    - path:
        type: PathPrefix
        value: /missing-policy
    backendRefs:
    - name: example-svc
      port: 80
      filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.kgateway.dev
          kind: TrafficPolicy
          name: does-not-exist
  # A valid backendRef policy is applied to the route.
  - matches:
    - path:
        type: PathPrefix
        value: /valid-policy
    backendRefs:
    - name: example-svc
      port: 80
      filters:
      - type: ExtensionRef
        extensionRef:
          group: gateway.kgateway.dev
          kind: TrafficPolicy
          name: extauth-valid
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: extauth-missing-extension
  namespace: infra
spec:
  extAuth:
    extensionRef:
      name: does-not-exist
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: extauth-valid
  namespace: infra
spec:
  extAuth:
    extensionRef:
      name: basic-extauth
---
apiVersion: v1
kind: Service
metadata:
  name: example-svc
  namespace: infra
spec:
  selector:
    test: test
  ports:
  - protocol: TCP
    port: 80
    targetPort: test
---
apiVersion: v1
kind: Service
metadata:
  name: ext-authz
  namespace: infra
spec:
  ports:
  - protocol: TCP
    port: 9000
    targetPort: 9000
