apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - example.com
  rules:
  - name: rule0
    matches:
    - path:
        type: PathPrefix
        value: /example-route
    backendRefs:
    - name: example-svc
      port: 80
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: local-rate-limit-descriptors
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: example-route
  rateLimit:
    local:
      tokenBucket:
        maxTokens: 100
        tokensPerFill: 10
        fillInterval: 1s
      descriptors:
      - entries:
        - type: Header
          header: x-user-id
        - type: Generic
          generic:
            key: service
            value: api
        tokenBucket:
          maxTokens: 5
          tokensPerFill: 1
          fillInterval: 2s
      - entries:
        - type: RemoteAddress
        tokenBucket:
          maxTokens: 6
          tokensPerFill: 2
          fillInterval: 3s
      - entries:
        - type: Path
        tokenBucket:
          maxTokens: 7
          tokensPerFill: 3
          fillInterval: 4s
      alwaysConsumeDefaultTokenBucket: false
      maxDynamicDescriptors: 100
---
apiVersion: v1
kind: Service
metadata:
  name: example-svc
spec:
  selector:
    test: test
  ports:
  - protocol: TCP
    port: 80
    targetPort: test
