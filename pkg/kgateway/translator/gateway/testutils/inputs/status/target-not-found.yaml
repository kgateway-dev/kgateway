apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-a
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "example.com"
  rules:
  - name: rule-a
    backendRefs:
    - name: example-svc
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: example-svc
spec:
  selector:
    test: test
  ports:
    - protocol: TCP
      port: 80
---
# One valid target and one misspelled target: keeps the Gateway ancestor and adds a
# TargetNotFound ancestor for the typo.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: partial
  generation: 2
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: example-gateway
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: route-b-typo
  cors:
    allowOrigins:
    - "https://example.com"
---
# Every target resolves but one names a rule the route does not have.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: bad-section
  generation: 1
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: route-a
    sectionName: rule-z
  transformation:
    response:
      add:
      - name: x-bad-section
        value: never-applied
---
# Only target is missing: no Gateway ancestor at all, just the TargetNotFound one.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: missing-service
  generation: 3
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: missing-svc
  connectTimeout: 5s
