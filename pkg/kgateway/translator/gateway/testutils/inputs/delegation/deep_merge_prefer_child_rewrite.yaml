# Parent and child each declare a URLRewrite filter with a distinct replacement prefix, and
# the parent carries inherited-policy-priority: DeepMergePreferChild. This demonstrates that
# for a builtin filter, the DeepMerge* strategies pick a fixed winner regardless of the
# PreferParent/PreferChild half of the annotation: the emitted route ends up with the
# parent's rewrite even though the annotation name says "PreferChild".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: parent-route
  namespace: infra
  annotations:
    kgateway.dev/inherited-policy-priority: DeepMergePreferChild
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /from-parent
    backendRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: "*"
      namespace: a
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: child-route
  namespace: a
spec:
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/pets
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /from-child
    backendRefs:
    - name: svc-a
      port: 8080
