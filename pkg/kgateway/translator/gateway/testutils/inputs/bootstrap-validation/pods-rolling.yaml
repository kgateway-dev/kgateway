# A rollout of the patched bootstrap is in progress: one proxy pod started with it,
# and one still runs the bootstrap from before the patches, with Envoy's defaults.
---
apiVersion: v1
kind: Pod
metadata:
  name: example-gateway-new-a
  namespace: gwtest
  labels:
    gateway.networking.k8s.io/gateway-name: example-gateway
  annotations:
    kgateway.dev/xds-validation-bootstrap: '{"layered_runtime":{"layers":[{"name":"limits","static_layer":{"re2.max_program_size.error_level":1000}}]}}'
spec:
  containers:
  - name: kgateway-proxy
    image: envoy
status:
  phase: Running
---
apiVersion: v1
kind: Pod
metadata:
  name: example-gateway-old-a
  namespace: gwtest
  labels:
    gateway.networking.k8s.io/gateway-name: example-gateway
spec:
  containers:
  - name: kgateway-proxy
    image: envoy
status:
  phase: Running
