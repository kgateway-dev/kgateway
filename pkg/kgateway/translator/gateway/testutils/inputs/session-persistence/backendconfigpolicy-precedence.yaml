apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: default
spec:
  gatewayClassName: example-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-a
  namespace: default
spec:
  selector:
    app: backend-a
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-b
  namespace: default
spec:
  selector:
    app: backend-b
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: backend-a-sp
  namespace: default
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: backend-a
  sessionPersistence:
    cookie:
      name: policy-cookie
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route
  namespace: default
spec:
  parentRefs:
    - name: example-gateway
  rules:
    # single backend with a policy: the policy wins over the rule
    - matches:
        - path:
            type: PathPrefix
            value: /single-policy
      backendRefs:
        - name: backend-a
          port: 3000
      sessionPersistence:
        sessionName: route-cookie
        type: Cookie
    # single backend without a policy: the rule applies
    - matches:
        - path:
            type: PathPrefix
            value: /single-route
      backendRefs:
        - name: backend-b
          port: 3000
      sessionPersistence:
        sessionName: route-cookie
        type: Cookie
    # split: the policy applies to backend-a, the rule to backend-b
    - matches:
        - path:
            type: PathPrefix
            value: /split
      backendRefs:
        - name: backend-a
          port: 3000
          weight: 50
        - name: backend-b
          port: 3000
          weight: 50
      sessionPersistence:
        sessionName: route-cookie
        type: Cookie
