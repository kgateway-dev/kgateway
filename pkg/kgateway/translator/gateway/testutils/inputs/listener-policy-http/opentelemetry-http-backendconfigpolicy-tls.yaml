apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  # these are set for testing purposes, in actual deployment they would be auto-generated by Kubernetes.
  uid: "12345678-abcd-1234-efgh-123456789012"
  generation: 3
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 8080
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: tracing-otel-http-bcp-tls
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: example-gateway
  default:
    httpSettings:
      tracing:
        provider:
          openTelemetry:
            httpService:
              backendRef:
                name: otel-collector
                kind: Backend
                group: gateway.kgateway.dev
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: otel-collector
spec:
  type: Static
  static:
    hosts:
    - host: otel.example.com
      port: 4318
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: otel-collector-tls
spec:
  targetRefs:
  - group: gateway.kgateway.dev
    kind: Backend
    name: otel-collector
  tls:
    insecureSkipVerify: true
    sni: "otel.example.com"
