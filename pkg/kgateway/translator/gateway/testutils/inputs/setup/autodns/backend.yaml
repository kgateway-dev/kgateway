kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: http-gw-for-test
  namespace: gwtest
spec:
  gatewayClassName: kgateway
  listeners:
  - protocol: HTTP
    port: 8080
    name: http
    allowedRoutes:
      namespaces:
        from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-to-upstream
  namespace: gwtest
spec:
  parentRefs:
    - name: http-gw-for-test
  hostnames:
    - "www.example.com"
  rules:
    - backendRefs:
        - name: static
          kind: Backend
          group: gateway.kgateway.dev
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: static
  namespace: gwtest
spec:
  type: Static
  # The host has to be a DNS name, not a literal IP: settings.dnsLookupFamily is
  # only applied to clusters Envoy resolves itself (the envoy.clusters.dns cluster
  # type), so with an IP here this scenario would translate identically under every
  # dnsLookupFamily setting - including the Auto this whole settings group exists
  # to cover.
  static:
    hosts:
      - host: static.example.com
        port: 8080
