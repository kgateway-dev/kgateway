kind: Namespace
apiVersion: v1
metadata:
  name: gwtest
---
# Shared pods and nodes, carried over from the envtest setup (pkg/kgateway/setup/testdata/setup_yaml).
# Changes here may need re-generation of all the output yamls.

# In the envtest setup, xDS requests came from this pod, so client-relative endpoint
# prioritization used its labels and locality. The translator harness does not: it
# translates endpoints for a fixed client with no labels and an empty locality (see
# TestCase.Run), so this pod is only an ordinary pod here.
apiVersion: v1
kind: Pod
metadata:
  namespace: gwtest
  labels:
    app: gateway
    version: v1
    topology.istio.io/network: n1
  name: gateway
spec:
  containers:
  - image: gateway
    name: gateway
    ports:
    - containerPort: 8080
      protocol: TCP
  nodeName: worker
  serviceAccount: default
  serviceAccountName: default
---
apiVersion: v1
kind: Node
metadata:
  labels:
    beta.kubernetes.io/arch: amd64
    beta.kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: worker
    kubernetes.io/os: linux
    topology.istio.io/subzone: r1z2s3
    topology.kubernetes.io/region: r1
    topology.kubernetes.io/zone: r1z2
  name: worker
spec:
  podCIDR: 10.244.1.0/24
  podCIDRs:
  - 10.244.1.0/24
  providerID: kind://docker/kgateway/worker
---
apiVersion: v1
kind: Node
metadata:
  labels:
    beta.kubernetes.io/arch: amd64
    beta.kubernetes.io/os: linux
    kubernetes.io/arch: amd64
