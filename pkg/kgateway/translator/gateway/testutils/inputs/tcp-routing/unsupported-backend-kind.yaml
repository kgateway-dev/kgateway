# A TCPRoute referencing a Backend type that only works on HTTP routes. The dynamic
# forward proxy resolves its destination through an HTTP filter that a TCP listener
# does not have, so the reference is rejected with ResolvedRefs=False/InvalidKind and
# routed to the blackhole cluster rather than to a cluster that can never carry traffic.
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: example-tcp-route
spec:
  parentRefs:
  - name: example-gateway
  rules:
  - backendRefs:
    - name: dfp-backend
      kind: Backend
      group: gateway.kgateway.dev
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: tcp
    protocol: TCP
    port: 8080
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: dfp-backend
spec:
  type: DynamicForwardProxy
  dynamicForwardProxy: {}
