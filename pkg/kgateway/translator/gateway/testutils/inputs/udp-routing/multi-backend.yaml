apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata:
  name: example-udp-route
spec:
  parentRefs:
  - name: example-gateway
  rules:
  - backendRefs:
    - name: example-udp-svc
      port: 8080
      weight: 90
    - name: example-udp-svc-2
      port: 8080
      weight: 10
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: udp
    protocol: UDP
    port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: example-udp-svc
spec:
  selector:
    app: example
  ports:
    - protocol: UDP
      port: 8080
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: example-udp-svc-2
spec:
  selector:
    app: example-2
  ports:
    - protocol: UDP
      port: 8080
      targetPort: 80
