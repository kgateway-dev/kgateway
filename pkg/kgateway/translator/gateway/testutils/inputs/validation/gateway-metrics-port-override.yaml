kind: GatewayParameters
apiVersion: gateway.kgateway.dev/v1alpha1
metadata:
  name: custom-stats
  namespace: default
spec:
  kube:
    stats:
      port: 9092 # override metrics port to 9092; 9091 is no longer reserved
---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: test
  namespace: default
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: custom-stats
  listeners:
  - protocol: HTTP
    port: 9091 # would be rejected without the GWP, but GWP sets metrics port to 9092
    name: http
    allowedRoutes:
      namespaces:
        from: All
