kind: GatewayParameters
apiVersion: gateway.kgateway.dev/v1alpha1
metadata:
  name: stats-disabled
  namespace: default
spec:
  kube:
    stats:
      enabled: false
---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: test
  namespace: default
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: stats-disabled
  listeners:
  - protocol: HTTP
    port: 9091 # allowed because the proxy stats server is disabled
    name: http
    allowedRoutes:
      namespaces:
        from: All
