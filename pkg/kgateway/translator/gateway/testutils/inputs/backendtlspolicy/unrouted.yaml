# BackendTLSPolicies whose targets are not referenced by any route. They still get status,
# reported against the target itself, because kgateway applies the TLS config to the
# target's cluster regardless of routing (for example a Backend used only by a
# GatewayExtension).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: unrouted-backend
spec:
  type: Static
  static:
    hosts:
    - host: issuer.example.com
      port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: unrouted-service
  labels:
    app: unrouted
spec:
  ports:
    - name: https
      port: 443
      targetPort: 8443
      appProtocol: https
  selector:
    app: unrouted
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: unrouted-backend-tls
spec:
  targetRefs:
  - group: gateway.kgateway.dev
    kind: Backend
    name: unrouted-backend
  validation:
    hostname: "issuer.example.com"
    wellKnownCACertificates: System
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: unrouted-service-tls
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: unrouted-service
    sectionName: https
  validation:
    hostname: "unrouted.example.com"
    wellKnownCACertificates: System
