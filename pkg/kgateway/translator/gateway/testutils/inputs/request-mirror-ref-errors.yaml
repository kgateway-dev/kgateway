# RequestMirror backendRefs that cannot be resolved. Each route keeps serving its
# primary backend without the mirror and reports ResolvedRefs=False.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: default
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: example.com
    allowedRoutes:
      namespaces:
        from: All
---
# Cross-namespace mirror with no ReferenceGrant: RefNotPermitted.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: not-permitted
  namespace: default
spec:
  parentRefs:
  - name: example-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /not-permitted
    filters:
    - type: RequestMirror
      requestMirror:
        backendRef:
          name: mirror
          namespace: other
          port: 80
    backendRefs:
    - name: primary
      port: 80
---
# Cross-namespace mirror permitted by a ReferenceGrant: mirrored, ResolvedRefs=True.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: permitted
  namespace: granted
spec:
  parentRefs:
  - name: example-gateway
    namespace: default
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /permitted
    filters:
    - type: RequestMirror
      requestMirror:
        backendRef:
          name: mirror
          namespace: other
          port: 80
    backendRefs:
    - name: primary
      namespace: default
      port: 80
---
# Mirror to a Service that does not exist: BackendNotFound.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: missing-mirror
  namespace: default
spec:
  parentRefs:
  - name: example-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /missing
    filters:
    - type: RequestMirror
      requestMirror:
        backendRef:
          name: does-not-exist
          port: 80
    backendRefs:
    - name: primary
      port: 80
---
# GRPCRoute cross-namespace mirror whose only grant names HTTPRoute: RefNotPermitted.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-not-permitted
  namespace: granted
spec:
  parentRefs:
  - name: example-gateway
    namespace: default
  rules:
  - matches:
    - method:
        service: example.Echo
    filters:
    - type: RequestMirror
      requestMirror:
        backendRef:
          name: mirror
          namespace: other
          port: 80
    backendRefs:
    - name: primary
      namespace: default
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: mirror-from-granted
  namespace: other
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: granted
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: primary-from-granted
  namespace: default
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: granted
  - group: gateway.networking.k8s.io
    kind: GRPCRoute
    namespace: granted
  to:
  - group: ""
    kind: Service
---
apiVersion: v1
kind: Service
metadata:
  name: primary
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mirror
  namespace: other
spec:
  ports:
  - port: 80
    targetPort: 8080
