apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: default
spec:
  gatewayClassName: example-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: priority-groups-route
  namespace: default
spec:
  parentRefs:
    - name: example-gateway
  hostnames:
    - "www.example.com"
  rules:
    - matches:
      - path:
          type: Exact
          value: /failover
      backendRefs:
        - name: priority-groups-backend
          kind: Backend
          group: gateway.kgateway.dev
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: priority-groups-backend
  namespace: default
spec:
  priorityGroups:
    - backendRefs:
        - name: primary-backend
        - name: dfp-backend
    - backendRefs:
        - name: failover-backend
        - name: gcp-backend-with-audience
    - backendRefs:
        - name: lambda-custom-backend
        - name: ec2-backend
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: primary-backend
  namespace: default
spec:
  type: Static
  static:
    hosts:
      - host: primary.example.com
        port: 8080
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: failover-backend
  namespace: default
spec:
  type: Static
  static:
    hosts:
      - host: failover.example.com
        port: 8080
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: gcp-backend-with-audience
  namespace: default
spec:
  type: GCP
  gcp:
    host: example.googleapis.com
    audience: "https://custom-audience.googleapis.com"
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: lambda-custom-backend
  namespace: default
spec:
  type: AWS
  aws:
    auth:
      type: Secret
      secretRef:
        name: localstack-creds
    lambda:
      accountId: "000000000000"
      functionName: my-test-function
      endpointURL: "http://172.18.0.2:4566"
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: ec2-backend
  namespace: default
spec:
  type: AWS
  aws:
    region: us-east-1
    auth:
      type: AssumeRole
      assumeRole:
        roleArn: arn:aws:iam::123456789012:role/describe-ec2
    ec2:
      port: 8080
      addressType: PrivateIP
      filters:
      - keyValue:
          key: app
          value: payments
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: dfp-backend
  namespace: default
spec:
  type: DynamicForwardProxy
  dynamicForwardProxy: {}
---
