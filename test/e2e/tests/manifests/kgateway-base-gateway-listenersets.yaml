# Base gateway variant applied when the installed Gateway API supports ListenerSets
# (experimental >= 1.3, standard >= 1.5). It adds spec.allowedListeners so that
# cross-namespace ListenerSets (e.g. the header_modifiers suite) can attach. On older
# APIs this field is not in the CRD schema and would be pruned, so the default
# kgateway-base-gateway.yaml is used instead.
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: gateway
  namespace: kgateway-base
spec:
  gatewayClassName: kgateway
  listeners:
    - protocol: HTTP
      port: 80
      name: http
      allowedRoutes:
        namespaces:
          from: All
  allowedListeners:
    namespaces:
      from: All
