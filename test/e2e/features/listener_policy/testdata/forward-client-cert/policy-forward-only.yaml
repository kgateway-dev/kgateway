# Mode=ForwardOnly, no details.
# Test asserts: backend sees the spoofed inbound XFCC verbatim, with no
# gateway-added entry.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: forward-client-cert-forward-only
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-mtls
      sectionName: mtls-forward-only
  default:
    httpSettings:
      forwardClientCertDetails:
        mode: ForwardOnly
