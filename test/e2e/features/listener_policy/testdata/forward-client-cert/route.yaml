# Routes traffic on every gw-mtls listener to the request-id-echo
# backend. We reuse request-id-echo because it echoes every request header
# in the response body, which lets us assert on x-forwarded-client-cert.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forward-client-cert-route
  namespace: default
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-mtls
      namespace: default
      sectionName: mtls-baseline
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-mtls
      namespace: default
      sectionName: mtls-sanitize-set-default
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-mtls
      namespace: default
      sectionName: mtls-sanitize-set-all
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-mtls
      namespace: default
      sectionName: mtls-append-forward
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-mtls
      namespace: default
      sectionName: mtls-sanitize
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw-mtls
      namespace: default
      sectionName: mtls-forward-only
  hostnames:
    - gateway.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: request-id-echo
          port: 8000
