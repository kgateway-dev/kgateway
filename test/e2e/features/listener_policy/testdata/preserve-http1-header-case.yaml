apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: preserve-http1-header-case
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gw
  default:
    httpSettings:
      preserveHttp1HeaderCase: true
---
kind: BackendConfigPolicy
apiVersion: gateway.kgateway.dev/v1alpha1
metadata:
  name: preserve-http1-header-case
spec:
  targetRefs:
    - name: raw-header-echo
      group: ""
      kind: Service
  http1ProtocolOptions:
    preserveHttp1HeaderCase: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-route
  namespace: default
spec:
  hostnames:
  - example.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gw
    namespace: default
  rules:
  - backendRefs:
    - name: raw-header-echo
      port: 8000
    matches:
    - path:
        type: PathPrefix
        value: /
