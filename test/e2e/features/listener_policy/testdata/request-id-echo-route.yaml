# Routes the per-test gw Gateway to the request-id-echo backend.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: request-id-echo-route
  namespace: default
spec:
  hostnames:
  - example.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gw
    namespace: default
  rules:
  - backendRefs:
    - name: request-id-echo
      port: 8000
    matches:
    - path:
        type: PathPrefix
        value: /
