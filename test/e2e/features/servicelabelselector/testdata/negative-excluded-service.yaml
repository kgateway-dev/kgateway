apiVersion: v1
kind: Service
metadata:
  name: negative-excluded-service
  namespace: default
  labels:
    e2e.kgateway.dev/discovery: enabled
    e2e.kgateway.dev/excluded: "true"
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: negative-excluded-service-route
  namespace: default
spec:
  parentRefs:
    - name: service-label-selector
  rules:
    - backendRefs:
        - name: negative-excluded-service
          port: 8080
