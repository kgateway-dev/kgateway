apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matching-service-route
  namespace: default
spec:
  parentRefs:
    - name: service-label-selector
  hostnames:
    - matching-selector.example.com
  rules:
    - backendRefs:
        - name: matching-service
          port: 8080
