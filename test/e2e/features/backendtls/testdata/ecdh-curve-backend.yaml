apiVersion: v1
kind: Pod
metadata:
  name: nginx-ecdsa
  namespace: kgateway-base
  labels:
    app.kubernetes.io/name: nginx-ecdsa
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: nginx
    image: nginx:1.28.0
    ports:
    - containerPort: 443
      name: https-web-svc
    volumeMounts:
    - name: nginx-conf
      mountPath: /etc/nginx/
      readOnly: true
  volumes:
  - name: nginx-conf
    configMap:
      name: nginx-ecdsa-conf
      items:
      - key: nginx.conf
        path: nginx.conf
      - key: ecdsa.crt
        path: ecdsa.crt
      - key: ecdsa.key
        path: ecdsa.key
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ecdsa-allowed
  namespace: kgateway-base
spec:
  selector:
    app.kubernetes.io/name: nginx-ecdsa
  ports:
    - protocol: TCP
      port: 8443
      targetPort: https-web-svc
      name: https
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ecdsa-default
  namespace: kgateway-base
spec:
  selector:
    app.kubernetes.io/name: nginx-ecdsa
  ports:
    - protocol: TCP
      port: 8443
      targetPort: https-web-svc
      name: https
