# nginx cert and key generated via:
# openssl ecparam -genkey -name secp384r1 -out ecdsa.key
# openssl req -x509 -new -key ecdsa.key -days 3650 -sha256 -out ecdsa.crt \
#   -subj '/CN=ecdsa.example.com' \
#   -addext "subjectAltName=DNS:ecdsa.example.com" \
#   -addext "keyUsage=digitalSignature" \
#   -addext "extendedKeyUsage=serverAuth"
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ecdsa-conf
  namespace: kgateway-base
data:
  nginx.conf: |
    user nginx;
    worker_processes  1;
    events {
      worker_connections  10240;
    }
    http {
      server {
          listen              443 ssl;
          server_name         ecdsa.example.com;
          ssl_certificate     /etc/nginx/ecdsa.crt;
          ssl_certificate_key /etc/nginx/ecdsa.key;

          location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }
      }
    }
