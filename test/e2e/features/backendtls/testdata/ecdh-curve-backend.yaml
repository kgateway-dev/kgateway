apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ecdsa-allowed-route
  namespace: kgateway-base
spec:
  parentRefs:
  - name: gateway
  hostnames:
  - "ecdsa-allowed.example.com"
  rules:
  - backendRefs:
    - name: nginx-ecdsa-allowed
      port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ecdsa-default-route
  namespace: kgateway-base
spec:
  parentRefs:
  - name: gateway
  hostnames:
  - "ecdsa-default.example.com"
  rules:
  - backendRefs:
    - name: nginx-ecdsa-default
      port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: ecdsa-allowed-tls-policy
  namespace: kgateway-base
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: nginx-ecdsa-allowed
  validation:
    hostname: "ecdsa.example.com"
    caCertificateRefs:
    - group: ""
      kind: ConfigMap
      name: ecdsa-ca
  options:
    kgateway.dev/ecdh-curves: "P-384,P-256"
    kgateway.dev/min-tls-version: "1.2"
    kgateway.dev/max-tls-version: "1.2"
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: ecdsa-default-tls-policy
  namespace: kgateway-base
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: nginx-ecdsa-default
  validation:
    hostname: "ecdsa.example.com"
    caCertificateRefs:
    - group: ""
      kind: ConfigMap
      name: ecdsa-ca
  options:
    kgateway.dev/min-tls-version: "1.2"
    kgateway.dev/max-tls-version: "1.2"
---
