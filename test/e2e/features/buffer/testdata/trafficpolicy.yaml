apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: buffered-route
  namespace: kgateway-base
spec:
  parentRefs:
    - name: gateway
  hostnames:
    - buffer.example.com
  rules:
    - backendRefs:
        - name: backend
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unbuffered-route
  namespace: kgateway-base
spec:
  parentRefs:
    - name: gateway
  hostnames:
    - no-buffer.example.com
  rules:
    - backendRefs:
        - name: backend
          port: 80
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: buffer-policy
  namespace: kgateway-base
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: buffered-route
  buffer:
    maxRequestSize: 1024