# A bootstrap overlay that sets node, a path the control plane manages. Adding a
# metadata key keeps the role the controller selects the proxy's configuration by.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: bootstrap-overlays
  namespace: default
spec:
  kube:
    envoyContainer:
      bootstrap:
        overlay:
          mergeStrategy: StructuredMerge
          value:
            node:
              metadata:
                e2e_marker: set
