# A bootstrap overlay that sets no path the control plane manages: a stats flush
# interval and a static runtime layer.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: bootstrap-overlays
  namespace: default
spec:
  kube:
    envoyContainer:
      bootstrap:
        overlay:
          mergeStrategy: StructuredMerge
          value:
            stats_flush_interval: 7s
            layered_runtime:
              layers:
                - name: e2e_runtime
                  static_layer:
                    e2e.bootstrap_overlays.marker: 1
