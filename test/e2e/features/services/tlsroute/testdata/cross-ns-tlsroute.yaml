apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: tls-route
  namespace: cross-namespace-allowed-client-ns
spec:
  parentRefs:
    - name: tls-gateway
      namespace: tls-route
      sectionName: listener-8444
  hostnames:
    - "example.com"
  rules:
    - backendRefs:
        - name: backend-svc
          namespace: cross-namespace-allowed-backend-ns
          port: 443
