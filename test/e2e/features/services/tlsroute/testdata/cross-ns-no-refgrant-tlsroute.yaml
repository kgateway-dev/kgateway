apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: tls-route
  namespace: client-ns-no-refgrant
spec:
  parentRefs:
    - name: tls-gateway
      namespace: tls-route
      sectionName: listener-8445
  hostnames:
    - "example.com"
  rules:
    - backendRefs:
        - name: backend-svc
          namespace: backend-ns-no-refgrant
          port: 443
