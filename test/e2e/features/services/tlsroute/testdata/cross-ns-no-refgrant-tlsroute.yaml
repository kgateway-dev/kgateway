apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: tls-route
  namespace: tls-no-refgrant-client
spec:
  parentRefs:
    - name: tls-gateway
      namespace: tls-route
      sectionName: listener-8445
  hostnames:
    - "example.com"
  rules:
    - backendRefs:
        - name: backend-svc
          namespace: tls-no-refgrant-backend
          port: 443
