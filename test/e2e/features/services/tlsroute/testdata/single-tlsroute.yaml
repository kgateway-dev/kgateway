apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: single-tls-route
  namespace: single-tls-route
spec:
  parentRefs:
  - name: tls-gateway
    namespace: tls-route
    sectionName: listener-6443
  hostnames:
  - "example.com"
  rules:
  - backendRefs:
    - name: single-svc
      port: 443
