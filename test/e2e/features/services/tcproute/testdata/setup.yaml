apiVersion: v1
kind: Namespace
metadata:
  name: tcp-route
---
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: tls-secret
  namespace: tcp-route
data:
# Common Name: example.com
# Subject Alternative Names: www.example.com
# Organization: Example Inc., CN=example.com
# Locality: San Francisco, O=Example Inc., CN=example.com
# State: California, L=San Francisco, O=Example Inc., CN=example.com
# Country: US, ST=California, L=San Francisco, O=Example Inc., CN=example.com
# Valid From: Feb 25 20:53:56 2025 GMT
# Valid To: Feb 23 20:53:56 2035 GMT
# Issuer: example.com
# Key Size: 2048 bit
# Serial Number: 56FCC1423A5915960494615398843723E2148B56
  tls.crt: 
  tls.key: 
---
# One Gateway shared by every subtest, each owning its own listener, so subtests only
# create and delete routes and backends instead of a proxy per subtest.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tcp-gateway
  namespace: tcp-route
spec:
  gatewayClassName: kgateway
  listeners:
    - name: listener-8087
      protocol: TCP
      port: 8087
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TCPRoute
    - name: listener-8088
      protocol: TCP
      port: 8088
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TCPRoute
    - name: listener-8089
      protocol: TCP
      port: 8089
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TCPRoute
    - name: listener-8443
      protocol: TLS
      port: 8443
      hostname: example.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: tls-secret
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TCPRoute
    - name: listener-8080
      protocol: TCP
      port: 8080
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TCPRoute
    - name: listener-8081
      protocol: TCP
      port: 8081
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: TCPRoute
---
# Immutable pod spec fields should be consistent with test/e2e/defaults/testdata/curl_pod.yaml
# due to https://github.com/kgateway-dev/kgateway/issues/13408.
apiVersion: v1
kind: Pod
metadata:
  name: curl
  namespace: tcp-route
  labels:
    app: curl
    app.kubernetes.io/name: curl
    version: v1
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: curl
      image: ghcr.io/kgateway-dev/curl:8.20.0
      imagePullPolicy: IfNotPresent
      command:
        - "tail"
        - "-f"
        - "/dev/null"
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
      volumeMounts:
        - name: server-certs
          mountPath: /etc/server-certs
          readOnly: true
  volumes:
    - name: server-certs
      secret:
        secretName: tls-secret

