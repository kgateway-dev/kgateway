apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: tcp-route
  namespace: client-ns-no-refgrant
spec:
  parentRefs:
    - name: tcp-gateway
      namespace: tcp-route
      sectionName: listener-8081
  rules:
    - backendRefs:
        - name: backend-svc
          namespace: backend-ns-no-refgrant
          port: 3001
