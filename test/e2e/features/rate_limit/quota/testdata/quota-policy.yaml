apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: quota
  namespace: kgateway-base
spec:
  parentRefs:
  - name: gateway
  hostnames:
  - example.com
  rules:
  - name: deny
    matches:
    - path:
        type: PathPrefix
        value: /deny
    backendRefs:
    - name: backend
      port: 80
  - name: allow
    matches:
    - path:
        type: PathPrefix
        value: /allow
    backendRefs:
    - name: backend
      port: 80
  - name: unscoped
    matches:
    - path:
        type: PathPrefix
        value: /unscoped
    backendRefs:
    - name: backend
      port: 80
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: quota-deny
  namespace: kgateway-base
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: quota
    sectionName: deny
  rateLimit:
    quota:
      extensionRef:
        name: rlqs
      bucket:
      - key: decision
        type: Generic
        value: deny
      - key: tenant
        type: Header
        header: x-tenant-id
      reportingInterval: 1s
      noAssignmentBehavior: Allow
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: quota-allow
  namespace: kgateway-base
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: quota
    sectionName: allow
  rateLimit:
    quota:
      extensionRef:
        name: rlqs
      bucket:
      - key: decision
        type: Generic
        value: allow
      - key: tenant
        type: Header
        header: x-tenant-id
      reportingInterval: 1s
