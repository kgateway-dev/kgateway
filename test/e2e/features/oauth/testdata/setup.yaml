apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    name: http
    protocol: TCP
  - port: 443
    targetPort: 8443
    name: https
    protocol: TCP
  selector:
    app.kubernetes.io/name: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.4.7
        imagePullPolicy: IfNotPresent
        args:
        - "start-dev"
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: admin
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          value: admin
        - name: KC_HOSTNAME
          # must match the Service name to be DNS resolvable; the Auth flow will use this hostname
          value: keycloak
        - name: KC_HTTPS_CERTIFICATE_FILE
          value: /etc/certs/tls.crt
        - name: KC_HTTPS_CERTIFICATE_KEY_FILE
          value: /etc/certs/tls.key
        - name: KC_HTTPS_PORT
          value: "8443"
        - name: KC_HTTP_PORT
          value: "8080"
        - name: KC_LOG_LEVEL
          value: debug
        readinessProbe:
          initialDelaySeconds: 3
          periodSeconds: 3
          tcpSocket:
            port: 8443
        volumeMounts:
        - name: certs
          mountPath: /etc/certs
          readOnly: true
      - name: setup
        image: quay.io/keycloak/keycloak:26.4.7
        command:
        - "sh"
        - "-c"
        - |
          set -ex

          KEYCLOAK_ADMIN=admin
          KEYCLOAK_ADMIN_PASSWORD=admin
          KEYCLOAK_SERVER=http://127.0.0.1:8080
          REALM=master
          USERNAME=kgateway
          PASSWORD=kgateway
          USER_EMAIL=kgateway@example.com
          CLIENT_ID=kgateway-client-id
          CLIENT_SECRET=kgateway-client-secret
          REDIRECT_URL=https://example.com/oauth2/redirect # must match the HTTPRoute/oauth host and path
          REDIRECT_URL_SECOND=https://example.com/anything/second/oauth2/redirect # must match the HTTPRoute/oauth-2 host and path
          REDIRECT_URL_SPLIT=https://example.com/split/oauth2/redirect # must match the HTTPRoute/oauth-split host and path
          REDIRECT_URL_DISCOVERY=https://example.com/anything/discovery/oauth2/redirect # must match the HTTPRoute/oauth-discovery host and path

          until /opt/keycloak/bin/kcadm.sh get realms --server "${KEYCLOAK_SERVER}" --realm master --user "${KEYCLOAK_ADMIN}" --password "${KEYCLOAK_ADMIN_PASSWORD}"; do
            echo "Waiting for Keycloak admin to be ready..."
            sleep 2
          done

          /opt/keycloak/bin/kcadm.sh create users \
          -s username="${USERNAME}" \
          -s enabled=true \
          -s email="${USER_EMAIL}" \
          -s emailVerified=true \
          --server "${KEYCLOAK_SERVER}" \
          --realm "${REALM}" \
          --user "${KEYCLOAK_ADMIN}" \
          --password "${KEYCLOAK_ADMIN_PASSWORD}"

          /opt/keycloak/bin/kcadm.sh set-password \
          --username "${USERNAME}" \
          --new-password "${PASSWORD}" \
          --server "${KEYCLOAK_SERVER}" \
          --realm "${REALM}" \
          --user "${KEYCLOAK_ADMIN}" \
          --password "${KEYCLOAK_ADMIN_PASSWORD}"

          /opt/keycloak/bin/kcreg.sh create \
          -s clientId="${CLIENT_ID}" \
          -s secret="${CLIENT_SECRET}" \
          -s "redirectUris=[\"${REDIRECT_URL}\",\"${REDIRECT_URL_SECOND}\",\"${REDIRECT_URL_SPLIT}\",\"${REDIRECT_URL_DISCOVERY}\"]" \
          -s consentRequired=false \
          --server "${KEYCLOAK_SERVER}" \
          --realm "${REALM}" \
          --user "${KEYCLOAK_ADMIN}" \
          --password "${KEYCLOAK_ADMIN_PASSWORD}"

          clientInternalId=$(/opt/keycloak/bin/kcadm.sh get clients \
          -q clientId="${CLIENT_ID}" \
          --server "${KEYCLOAK_SERVER}" \
          --realm "${REALM}" \
          --user "${KEYCLOAK_ADMIN}" \
          --password "${KEYCLOAK_ADMIN_PASSWORD}" \
          | sed -n 's/.*"id" : "\([^"]*\)".*/\1/p' | xargs)

          /opt/keycloak/bin/kcadm.sh update clients/$clientInternalId \
          -s 'attributes."post.logout.redirect.uris"=*' \
          --server "${KEYCLOAK_SERVER}" \
          --realm "${REALM}" \
          --user "${KEYCLOAK_ADMIN}" \
          --password "${KEYCLOAK_ADMIN_PASSWORD}"

          tail -f /dev/null # keep the container running
      volumes:
      - name: certs
        secret:
          secretName: keycloak-tls
      terminationGracePeriodSeconds: 0
---
# example cert and key generated using:
# openssl req -x509 -out example.crt -keyout example.key -newkey rsa:2048 -days 3650 -nodes -sha256 -subj '/CN=example.com' -extensions EXT -config <( printf "[dn]\nCN=example.com\n[req]\ndistinguished_name = dn\n[EXT]\nsubjectAltName=DNS:example.com,DNS:keycloak,DNS:keycloak.default.svc.cluster.local\nkeyUsage=digitalSignature\nextendedKeyUsage=serverAuth")
#
# example.com is the name the proxy and the test client reach Keycloak by. The in-cluster names
# are here for the control plane: OIDC discovery is a controller-side fetch of the issuer's
# well-known document, so the issuer URI has to be a name resolvable from the controller's
# namespace, and the certificate has to carry it.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-tls
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
