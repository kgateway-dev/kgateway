---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: oauth-gateway
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: oauth-gateway
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: keycloak-tls # same as the secret used for Keycloak TLS
        kind: Secret
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: oauth-gateway
spec:
  kube:
    envoyContainer:
      bootstrap:
        componentLogLevels:
          jwt: debug
          oauth2: debug
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth
spec:
  parentRefs:
  - name: oauth-gateway
  hostnames:
  - example.com # must match the CN in the Keycloak TLS cert
  rules:
  - name: rule0
    matches:
    - path:
        type: PathPrefix
        value: /
    filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          set:
            - name: x-oauth2-token-types
              value: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:accessToken:typ)%, %DYNAMIC_METADATA(envoy.filters.http.jwt_authn:idToken:typ)%"
    backendRefs:
    - name: httpbin
      port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: no-oauth
spec:
  parentRefs:
  - name: oauth-gateway
  hostnames:
  - test.com
  rules:
  - name: rule0
    matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: httpbin
      port: 8443
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: oauth-route
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: oauth
  oauth2:
    extensionRef:
      name: keycloak-oauth
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: keycloak-oauth
spec:
  oauth2:
    backendRef:
      kind: Service
      name: keycloak
      port: 443
    tokenEndpoint: https://keycloak/realms/master/protocol/openid-connect/token
    authorizationEndpoint: https://keycloak/realms/master/protocol/openid-connect/auth
    endSessionEndpoint: https://keycloak/realms/master/protocol/openid-connect/logout
    credentials:
      clientID: kgateway-client-id # must match the clientId created in Keycloak
      clientSecretRef:
        name: oauth-client-secret
    redirectURI: https://example.com/oauth2/redirect # must match the REDIRECT_URL used in Keycloak setup
    logoutPath: /logout
    forwardAccessToken: true
    scopes: ["openid", "email"]
    jwt:
      jwksURI: https://keycloak/realms/master/protocol/openid-connect/certs
      accessToken:
        audiences:
          - account
        claimsToHeaders:
          - name: preferred_username
            header: x-oauth2-preferred-username
      idToken:
        claimsToHeaders:
          - name: email
            header: x-oauth2-email
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-jwks
  labels:
    app.kubernetes.io/name: keycloak
spec:
  type: ClusterIP
  ports:
  - port: 9443
    targetPort: 8443
    name: https
    protocol: TCP
  selector:
    app.kubernetes.io/name: keycloak
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: keycloak-jwks-tls
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: keycloak-jwks
  validation:
    hostname: example.com
    caCertificateRefs:
    - group: ""
      kind: ConfigMap
      name: keycloak-tls-ca
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth-client-secret
data:
  # kgateway-client-secret; must match the client secret created in Keycloak
  client-secret: a2dhdGV3YXktY2xpZW50LXNlY3JldA==
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: keycloak-tls
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: keycloak
  validation:
    hostname: example.com
    caCertificateRefs:
    - group: ""
      kind: ConfigMap
      name: keycloak-tls-ca
