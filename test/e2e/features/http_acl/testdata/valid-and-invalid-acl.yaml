---
# Two TrafficPolicies target the same HTTPRoute:
#   valid-acl-policy   — well-formed CIDR; deny 192.168.0.0/16
#   invalid-cidr-acl-policy — CIDR with host bits set (172.18.0.0/12)
#
# Expected behavior (standard validation mode):
#   - valid-acl-policy is accepted and its deny/allow rules apply to the route
#   - invalid-cidr-acl-policy is rejected by the control plane (Accepted=False,
#     reason=Invalid) with a message naming the bad CIDR; it contributes no ACL
#     config to the route
#   - The HTTPRoute itself remains Accepted=True — the route is NOT replaced with
#     a 500 direct response, because the invalid CIDR is caught before any invalid
#     xDS config reaches Envoy
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-route
  namespace: kgateway-base
spec:
  hostnames:
    - httpbin
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
      namespace: kgateway-base
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: httpbin
          port: 8000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: valid-acl-policy
  namespace: kgateway-base
spec:
  targetRefs:
    - name: httpbin-route
      kind: HTTPRoute
      group: gateway.networking.k8s.io
  acl:
    defaultAction: allow
    rules:
      - cidrs:
          - "192.168.0.0/16"
        action: deny
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: invalid-cidr-acl-policy
  namespace: kgateway-base
spec:
  targetRefs:
    - name: httpbin-route
      kind: HTTPRoute
      group: gateway.networking.k8s.io
  acl:
    defaultAction: allow
    rules:
      - cidrs:
          - "172.18.0.0/12"  # invalid: host bits set; correct network address is 172.16.0.0/12
        action: deny
