# Two mirror routes shadow to the mirror-sink Gateway, which only ever receives mirrored
# traffic and access-logs the received :authority. keep-host sets disableShadowHostSuffixAppend;
# default-host keeps Envoy's default "-shadow" suffix as the control.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: kgateway-base
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: kgateway-base
  labels:
    app.kubernetes.io/name: httpbin
    service: httpbin
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8080
  selector:
    app.kubernetes.io/name: httpbin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: kgateway-base
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: httpbin
      version: v1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: httpbin
        version: v1
    spec:
      serviceAccountName: httpbin
      containers:
        - image: docker.io/mccutchen/go-httpbin:v2.6.0
          imagePullPolicy: IfNotPresent
          name: httpbin
          command: [ go-httpbin ]
          args:
            - "-port"
            - "8080"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "200m"
---
# Mirror-sink Gateway: its proxy Service (named after the Gateway) is the mirror backendRef target.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mirror-sink
  namespace: kgateway-base
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
---
# Catch-all so shadow requests (any :authority, including the "-shadow" variant) are accepted and logged.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mirror-sink-route
  namespace: kgateway-base
spec:
  parentRefs:
    - name: mirror-sink
  rules:
    - backendRefs:
        - name: httpbin
          port: 8000
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: HTTPListenerPolicy
metadata:
  name: mirror-sink-logs
  namespace: kgateway-base
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mirror-sink
  accessLog:
    - fileSink:
        path: /dev/stdout
        jsonFormat:
          authority: "%REQ(:AUTHORITY)%"
          path: "%REQ(:PATH)%"
          method: "%REQ(:METHOD)%"
          response_code: "%RESPONSE_CODE%"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mirror-keep-host
  namespace: kgateway-base
spec:
  parentRefs:
    - name: gateway
      namespace: kgateway-base
  hostnames:
    - "mirror.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /anything/keep-host
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: mirror-sink
              port: 8080
      backendRefs:
        - name: httpbin
          port: 8000
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: mirror-keep-host-policy
  namespace: kgateway-base
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mirror-keep-host
  requestMirror:
    disableShadowHostSuffixAppend: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mirror-default-host
  namespace: kgateway-base
spec:
  parentRefs:
    - name: gateway
      namespace: kgateway-base
  hostnames:
    - "mirror.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /anything/default-host
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: mirror-sink
              port: 8080
      backendRefs:
        - name: httpbin
          port: 8000
