# example-svc lives in the nginx namespace so it can select the shared nginx pod
# (test/e2e/defaults/testdata/nginx_pod.yaml). The basicrouting HTTPRoutes reference
# it cross-namespace, permitted by reference-grant.yaml.
apiVersion: v1
kind: Service
metadata:
  name: example-svc
  namespace: nginx
spec:
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - protocol: TCP
      port: 8080
      targetPort: http-web-svc
