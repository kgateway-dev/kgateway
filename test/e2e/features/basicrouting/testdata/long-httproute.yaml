# Verifies that a very long HTTPRoute name still routes. The backend is the canonical
# httpbin (test/e2e/defaults/testdata/httpbin.yaml), applied via the test case; both this
# route and httpbin live in the default namespace, so no ReferenceGrant is needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: very-long-httproute-name-to-verify-routing-behavior-still-works-much-more-longer
  namespace: default
spec:
  parentRefs:
    - name: gateway
  hostnames:
    - "long.example.com"
  rules:
    - backendRefs:
        - name: httpbin
          port: 8000
