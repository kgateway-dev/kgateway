# Headless variant of example-svc (clusterIP: None) in the nginx namespace, selecting
# the shared nginx pod. Used by TestHeadlessService to exercise headless-service routing.
apiVersion: v1
kind: Service
metadata:
  name: example-svc
  namespace: nginx
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - protocol: TCP
      port: 8080
      targetPort: http-web-svc
