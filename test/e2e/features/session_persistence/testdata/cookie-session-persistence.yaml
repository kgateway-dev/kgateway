apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-cookie
  namespace: default
spec:
  parentRefs:
  - name: gw-session-persistence
  hostnames: ["cookie.echo.local"]
  rules:
  - backendRefs:
    - name: echo
      port: 8080
    sessionPersistence:
      type: Cookie
      absoluteTimeout: 1h
      cookie:
        name: Session-A
        lifetimeType: Permanent
