apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-bcp-override
  namespace: default
spec:
  parentRefs:
  - name: gw-session-persistence
  hostnames: ["bcp-override.echo.local"]
  rules:
  - backendRefs:
    - name: echo
      port: 8080
    sessionPersistence:
      type: Cookie
      cookie:
        name: route-cookie
