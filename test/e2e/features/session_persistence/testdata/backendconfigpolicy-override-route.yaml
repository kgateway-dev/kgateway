apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-bcp-override
  namespace: default
spec:
  gatewayClassName: kgateway
  listeners:
  - name: http
    port: 8080
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-bcp-override
  namespace: default
spec:
  parentRefs:
  - name: gw-bcp-override
  hostnames: ["echo.local"]
  rules:
  - backendRefs:
    - name: echo
      port: 8080
    sessionPersistence:
      type: Cookie
      cookie:
        name: route-cookie
