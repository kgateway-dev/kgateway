apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-header
  namespace: default
spec:
  parentRefs:
  - name: gw-session-persistence
  hostnames: ["header.echo.local"]
  rules:
  - backendRefs:
    - name: echo
      port: 8080
    sessionPersistence:
      type: Header
      absoluteTimeout: 100s 
      header:
        name: Session-A