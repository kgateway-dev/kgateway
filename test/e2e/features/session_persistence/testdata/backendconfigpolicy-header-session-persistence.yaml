apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-bcp-header
  namespace: default
spec:
  parentRefs:
  - name: gw-session-persistence
  hostnames: ["bcp-header.echo.local"]
  rules:
  - backendRefs:
    - name: echo
      port: 8080
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: echo-bcp-header
  namespace: default
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: echo
  sessionPersistence:
    type: Header
    header:
      name: session-a
