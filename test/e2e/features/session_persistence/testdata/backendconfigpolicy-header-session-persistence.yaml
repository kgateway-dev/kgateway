apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-bcp-header
  namespace: default
spec:
  gatewayClassName: kgateway
  listeners:
  - name: http
    port: 8080
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-bcp-header
  namespace: default
spec:
  parentRefs:
  - name: gw-bcp-header
  hostnames: ["echo.local"]
  rules:
  - backendRefs:
    - name: echo
      port: 8080
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: echo-bcp-header
  namespace: default
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: echo
  sessionPersistence:
    type: Header
    header:
      name: session-a
