# Istio waypoint for the test namespace. The ingress-use-waypoint tests send
# ingress traffic from a kgateway Gateway through it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: test-waypoint
  labels:
    istio.io/rev: kgateway-waypoint-rev
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
