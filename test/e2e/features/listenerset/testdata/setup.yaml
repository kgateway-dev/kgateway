kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: gw
spec:
  gatewayClassName: kgateway
  listeners:
    - protocol: HTTP
      port: 80
      name: http
      allowedRoutes:
        namespaces:
          from: Same
    - protocol: HTTP
      port: 8081
      name: http-2
      allowedRoutes:
        namespaces:
          from: Same
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchLabels:
          allowed: ns
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-route
spec:
  parentRefs:
    - name: gw
  hostnames:
    - "example.com"
  rules:
    - backendRefs:
        # references the shared nginx Service (ns nginx) cross-namespace;
        # authorized by the ReferenceGrant in the shared nginx manifest.
        - name: nginx
          namespace: nginx
          port: 8080
---
apiVersion: v1
kind: Namespace
metadata:
  name: allowed-ns
  labels:
    allowed: ns
