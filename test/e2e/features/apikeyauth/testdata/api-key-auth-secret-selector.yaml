---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-route-secret-selector
  namespace: kgateway-base
spec:
  hostnames:
    - httpbin
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
      namespace: kgateway-base
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: httpbin
          port: 8000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /status/200
---
# Two Secrets carrying the selector label, to prove keys are aggregated across
# every match rather than taken from a single Secret.
apiVersion: v1
kind: Secret
metadata:
  name: api-keys-selected-one
  namespace: kgateway-base
  labels:
    apikeys: selector-test
type: Opaque
stringData:
  client1: k-sel-111
---
apiVersion: v1
kind: Secret
metadata:
  name: api-keys-selected-two
  namespace: kgateway-base
  labels:
    apikeys: selector-test
type: Opaque
stringData:
  client2: k-sel-222
---
# Carries a key but not the label. It must never be accepted, which also
# demonstrates that its contents are never loaded: nothing references it.
apiVersion: v1
kind: Secret
metadata:
  name: api-keys-unselected
  namespace: kgateway-base
  labels:
    apikeys: something-else
type: Opaque
stringData:
  client3: k-sel-333
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: api-key-auth-policy-secret-selector
  namespace: kgateway-base
spec:
  targetRefs:
    - name: httpbin-route-secret-selector
      kind: HTTPRoute
      group: gateway.networking.k8s.io
  apiKeyAuth:
    keySources:
      - header: "api-key"
    forwardCredential: true
    secretSelector:
      matchLabels:
        apikeys: selector-test
