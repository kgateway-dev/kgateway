apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: multi-target-policy
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gw
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: route-b-typo
  cors:
    allowOrigins:
      - "https://ignored.com"
