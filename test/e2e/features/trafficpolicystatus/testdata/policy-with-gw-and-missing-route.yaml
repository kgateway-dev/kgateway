# route-b exists but the policy misspells it; policy-with-gw-and-fixed-route.yaml fixes the
# typo. The route lives here so the test case's teardown deletes it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-b
spec:
  parentRefs:
  - name: gw
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: multi-target-policy
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gw
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: route-b-typo
  cors:
    allowOrigins:
      - "https://ignored.com"
