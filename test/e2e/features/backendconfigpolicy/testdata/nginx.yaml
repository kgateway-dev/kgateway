apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route
  namespace: kgateway-base
spec:
  parentRefs:
  - name: gateway
    namespace: kgateway-base
  rules:
  - backendRefs:
    - name: nginx
      port: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: kgateway-base
spec:
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - protocol: TCP
      port: 8080
      targetPort: http-web-svc
      name: http
    - protocol: TCP
      port: 8443
      targetPort: https-web-svc
      name: https
