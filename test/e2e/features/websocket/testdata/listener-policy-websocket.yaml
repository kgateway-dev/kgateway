apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: websocket-upgrade-policy
  namespace: kgateway-base
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
  default:
    httpSettings:
      upgradeConfig:
        enabledUpgrades:
          - "websocket"
