apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: xds-warming-empty
  namespace: kgateway-base
spec:
  parentRefs:
    - name: gateway
  hostnames:
    - "xds-warming-empty.example.com"
  rules:
    - backendRefs:
        # warming-new has a Service (setup.yaml) but no Deployment in this test: a
        # permanently empty backend (#14352). The route publishes and answers 503.
        - name: warming-new
          port: 8080
