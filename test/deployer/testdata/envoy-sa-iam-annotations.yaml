apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kgateway
spec:
  controllerName: kgateway.dev/kgateway
  description: Standard class for managing Gateway API ingress traffic.
  parametersRef:
    group: gateway.kgateway.dev
    kind: GatewayParameters
    name: sa-iam-gwp
    namespace: default
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: sa-iam-gwp
  namespace: default
spec:
  kube:
    serviceAccountOverlay:
      metadata:
        annotations:
          eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/kgateway-role"
    deploymentOverlay:
      metadata:
        labels:
          # Setting a label to null in the overlay removes it from the rendered
          # resource. YAML null deserializes to "" in map[string]string, and the
          # overlay merge treats empty string values as deletions.
          app.kubernetes.io/instance: null
---
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: gw
  namespace: default
spec:
  gatewayClassName: kgateway
  listeners:
    - protocol: HTTP
      port: 8080
      name: http
      allowedRoutes:
        namespaces:
          from: Same
