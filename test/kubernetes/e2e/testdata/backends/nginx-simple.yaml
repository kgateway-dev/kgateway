---
# Simple nginx for basic HTTP backend testing
apiVersion: v1
kind: Service
metadata:
  name: nginx-simple
  namespace: default
  labels:
    app.kubernetes.io/name: nginx-simple
    app.kubernetes.io/component: http-backend
    app.kubernetes.io/part-of: kgateway-e2e-tests
spec:
  selector:
    app.kubernetes.io/name: nginx-simple
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-simple
  namespace: default
  labels:
    app.kubernetes.io/name: nginx-simple
    app.kubernetes.io/component: http-backend
    app.kubernetes.io/part-of: kgateway-e2e-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-simple
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-simple
        app.kubernetes.io/component: http-backend
        app.kubernetes.io/part-of: kgateway-e2e-tests
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"