---
# Minimal nginx with TLS for backend TLS testing (namespaced version)
# Use this ONLY for TLS-specific tests that require SSL/TLS backends in custom namespaces
apiVersion: v1
kind: Service
metadata:
  name: nginx-tls
  # Note: Namespace should be provided by test suite
  labels:
    app.kubernetes.io/name: nginx-tls
    app.kubernetes.io/component: tls-backend
    app.kubernetes.io/part-of: kgateway-e2e-tests
spec:
  selector:
    app.kubernetes.io/name: nginx-tls
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 80
    - name: https
      protocol: TCP
      port: 8443
      targetPort: 443
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-tls-config
  # Note: Namespace should be provided by test suite
  labels:
    app.kubernetes.io/name: nginx-tls
    app.kubernetes.io/component: tls-backend
    app.kubernetes.io/part-of: kgateway-e2e-tests
data:
  nginx.conf: |
    user nginx;
    worker_processes 1;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    events {
      worker_connections 1024;
    }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;
      
      # HTTP server
      server {
        listen 80;
        server_name _;
        location / {
          return 200 'OK HTTP';
          add_header Content-Type text/plain;
        }
        location /health {
          return 200 'healthy';
          add_header Content-Type text/plain;
        }
      }
      
      # HTTPS server  
      server {
        listen 443 ssl;
        server_name example.com;
        ssl_certificate /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        location / {
          return 200 'OK HTTPS';
          add_header Content-Type text/plain;
        }
        location /health {
          return 200 'healthy';
          add_header Content-Type text/plain;
        }
      }
    }
