apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-tls
  # Note: Namespace should be provided by test suite
  labels:
    app.kubernetes.io/name: nginx-tls
    app.kubernetes.io/component: tls-backend
    app.kubernetes.io/part-of: kgateway-e2e-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-tls
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-tls
        app.kubernetes.io/component: tls-backend
        app.kubernetes.io/part-of: kgateway-e2e-tests
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: https
          containerPort: 443
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: nginx-ssl
          mountPath: /etc/nginx/ssl
          readOnly: true
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-tls-config
          items:
          - key: nginx.conf
            path: nginx.conf
      - name: nginx-ssl
        configMap:
          name: nginx-tls-config
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key