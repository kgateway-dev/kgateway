apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-cnn
spec:
  parentRefs:
  - name: gateway-cnn
  rules:
  - backendRefs:
    - name: cnn
      group: gateway.kgateway.dev
      kind: Backend
    filters:
      - type: URLRewrite
        urlRewrite:
          hostname: edition.cnn.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-cnn
spec:
  gatewayClassName: kgateway
  listeners:
  - name: http
    protocol: HTTP
    port: 8080
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: cnn
  namespace: default
spec:
  type: Static
  static:
    hosts:
      - host: edition.cnn.com
        port: 443 
---
kind: BackendConfigPolicy
apiVersion: gateway.kgateway.dev/v1alpha1
metadata:
  name: backend-tls-policy-cnn
spec:
  targetRefs:
    - name: cnn
      group: gateway.kgateway.dev
      kind: Backend
  tls:
    tlsOrigination: {}
    sni: edition.cnn.com