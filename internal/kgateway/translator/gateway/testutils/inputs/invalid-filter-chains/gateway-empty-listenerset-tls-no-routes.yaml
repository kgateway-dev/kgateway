apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
spec:
  gatewayClassName: kgateway
  listeners: []
---
apiVersion: gateway.networking.k8s.io/apisx/v1alpha1
kind: XListenerSet
metadata:
  name: example-listenerset
spec:
  gatewayRefs:
  - name: example-gateway
  listeners:
  - name: tls
    protocol: TLS
    port: 8443
    hostname: "example.com"
    tls:
      mode: Passthrough