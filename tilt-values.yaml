# Tilt-specific values for local development with kgateway
# This file sets up the controller for local development and debugging

# Image settings for local development
image:
  registry: ghcr.io/kgateway-dev

# Configure validation behavior
validation:
  level: strict

# Controller configuration
controller:
  # Enable debug logging for troubleshooting
  logLevel: debug
  # Extra environment variables for the controller
  extraEnv:
    # Keep leader election enabled for Tilt/debugging (set to "false" to keep it active)
    KGW_DISABLE_LEADER_ELECTION: "false"