# Example: Custom TLS configuration for Istio workloads
# This demonstrates how to disable Istio auto-mTLS and enable custom TLS modes

---
# Option 1: Disable Istio auto-mTLS for a specific service
apiVersion: v1
kind: Service
metadata:
  name: my-service-no-istio-mtls
  namespace: default
  annotations:
    # Disable Istio auto-mTLS for this workload
    istio.kgateway.io/disable-auto-mtls: "true"
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: my-app

---
# Option 2: Enable custom TLS mode (custom-mtls)
apiVersion: v1
kind: Service
metadata:
  name: my-service-custom-mtls
  namespace: default
  annotations:
    # Enable custom mTLS mode - this will disable Istio auto-mTLS
    istio.kgateway.io/tls-mode: "custom-mtls"
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: my-app

---
# Option 3: Enable custom TLS mode (custom-simple)
apiVersion: v1
kind: Service
metadata:
  name: my-service-custom-simple
  namespace: default
  annotations:
    # Enable custom simple TLS mode - this will disable Istio auto-mTLS
    istio.kgateway.io/tls-mode: "custom-simple"
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: my-app

---
# Note: The custom TLS modes (custom-mtls, custom-simple) are currently
# placeholders that will be implemented in future iterations.
# For now, they will disable Istio auto-mTLS and log a message.
# 
# To provide actual custom TLS configuration, you can use:
# - BackendConfigPolicy with TLS configuration
# - BackendTLSPolicy for TLS validation
# - Or extend the createCustomTLSMatch function to handle specific modes


