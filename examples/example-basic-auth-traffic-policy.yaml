# Example: HTTP Basic Authentication with TrafficPolicy
#
# This example demonstrates how to configure HTTP basic authentication using TrafficPolicy.
# Basic auth validates requests against username/password pairs in htpasswd format.
#
# Supported htpasswd hash formats:
#   - bcrypt: $2y$<cost>$<salt><hash> (recommended, most secure)
#   - MD5 (APR1): $apr1$<salt>$<hash> (Apache MD5, widely supported)
#   - SHA-1: {SHA}<base64-hash> (legacy, less secure)
#   - crypt: <salt><hash> (legacy, least secure)
#
# To generate htpasswd entries:
#   # Using htpasswd tool (bcrypt - recommended):
#   htpasswd -nbB username password
#
#   # Using htpasswd tool (MD5):
#   htpasswd -nbm username password
#
#   # Using openssl (MD5):
#   printf "username:$(openssl passwd -apr1 password)\n"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: example-gateway
  namespace: default
spec:
  gatewayClassName: kgateway
  listeners:
  - name: http
    protocol: HTTP
    port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: protected-route
  namespace: default
spec:
  parentRefs:
  - name: example-gateway
  hostnames:
  - "api.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: backend-service
      port: 8080
---
# Option 1: Inline users with bcrypt hashing (most secure)
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: basic-auth-inline-bcrypt
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: protected-route
  basicAuth:
    users:
      # Generated with: htpasswd -nbB alice password123
      - "alice:$2y$05$abcdefghijklmnopqrstuv.0123456789ABCDEFGHIJKLMNOPQRST"
      # Generated with: htpasswd -nbB bob secretpass
      - "bob:$2y$05$zyxwvutsrqponmlkjihgfe.ZYXWVUTSRQPONMLKJIHGFEDCBA9876"
    # Optional: Forward the authenticated username to the backend
    forwardUsernameHeader: "X-Authenticated-User"
---
# Option 2: Inline users with MD5/APR1 hashing (widely compatible)
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: basic-auth-inline-md5
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: protected-route
  basicAuth:
    users:
      # Generated with: htpasswd -nbm user1 pass1
      - "user1:$apr1$Uutynkzs$Ia24HkpRC/p7Yq16FakHy1"
      # Generated with: htpasswd -nbm user2 pass2
      - "user2:$apr1$uUzorz.t$kwOhJPMeLDe6IaUwol7iv."
---
# Option 3: Reference a Kubernetes secret
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth-credentials
  namespace: default
type: Opaque
stringData:
  # The .htpasswd key with htpasswd data (users alice and bob, password is password).
  .htpasswd: alice:$apr1$NnNOgfuJ$qRCLjc8g7qKfNNBG/ET2A0\nbob:$apr1$f3d/ntwE$/CVxmIZyQF7GH53o0mBTK/
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: basic-auth-secret
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: protected-route
  basicAuth:
    secretRef:
      name: basic-auth-credentials
---
# Option 4: Gateway-level basic auth with per-route override
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: basic-auth-gateway-level
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: example-gateway
  basicAuth:
    users:
      - "gateway-user:$2y$05$abcdefghijklmnopqrstuv.0123456789ABCDEFGHIJKLMNOPQRST"
---
# Route that disables the gateway-level basic auth
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: basic-auth-disabled
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: public-route
  basicAuth:
    disable: {}
---
# Testing basic auth:
# curl -v http://api.example.com/api
# Expected: 401 Unauthorized
#
# curl -v -u alice:password123 http://api.example.com/api
# Expected: 200 OK (or backend response)
#
# curl -v -H "Authorization: Basic $(echo -n 'alice:password123' | base64)" http://api.example.com/api
# Expected: 200 OK (or backend response)
