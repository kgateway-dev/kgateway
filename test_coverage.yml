# ref: https://github.com/vladopajic/go-test-coverage/blob/a5134457f681defa8eada436f1bcda10407f4f8b/.testcoverage.example.yml

# (mandatory)
# Path to coverprofile file (output of `go test -coverprofile` command)
profile: _output/cover.merged.out

# Holds coverage thresholds percentages, values should be in range [0-100]
# We should strive to increase these percentages over time
threshold:
  # (optional; default 0)
  # The minimum coverage that each file should have.
  # File and package floors remain disabled; coverage varies by responsibility.
  file: 0

  # (optional; default 0)
  # The minimum coverage that each package should have. Not enforced yet, see above.
  package: 0

  # (optional; default 0)
  # CI baseline (2026-10-17): approximately 81% unit-only and 83% combined.
  # Keep a modest regression budget below that baseline. The long-term goal is 85%.
  total: 80

# Holds regexp rules which will override thresholds for matched files or packages
# using their paths.
#
# First rule from this list that matches file or package is going to apply
# new threshold to it. If project has multiple rules that match same path,
# override rules should be listed in order from specific to more general rules.
override:
  # Calls to external library, which is tested
  - threshold: 0
    path: ^hack/generate.go
  # The only code at the top-level of the `pkg/kgateway` package is code generation
  - threshold: 0
    path: ^pkg/kgateway$

# Holds regexp rules which will exclude matched files or packages
# from coverage statistics
exclude:
  # Exclude files or packages matching their paths
  paths:
    # Exclude the protobuf generated files (pb.go, pb.equal.go, pb.hash.go)
    - \.pb\.go$
    - \.pb\.hash\.go$
    - \.pb\.equal\.go$
    # Exclude generated code (deepcopy, register, ...), which tests can't meaningfully cover
    - zz_generated[^/]*\.go$
    # Generated Kubernetes clients, apply configurations, and OpenAPI schemas
    - ^pkg/client/
    - ^api/applyconfiguration/
    - ^pkg/generated/
    # Generated query mocks are test support, not controller implementation
    - ^pkg/kgateway/query/mocks/
    # Exclude test support code (helpers, matchers, fixtures); it is exercised by the tests, not under test
    - ^test/
    # Exclude the tooling that lives under hack/ (code generation, CI helpers)
    - ^hack/
