name: Agent Gateway Conformance Tests
description: run kubernetes gateway api conformance tests for agent-gateway
inputs:
  api-version:
    description: "Override of the sig Gateway API to test against."
    required: false
runs:
  using: "composite"
  steps:
  - name: Prep Go Runner
    uses: ./.github/actions/prep-go-runner
  - uses: azure/setup-kubectl@v4
    id: kubectl
    with:
      version: ${{ matrix.kube-version.kubectl }}
  - name: Set and retrieve environment variables
    shell: bash
    run: |
      # We want to conditionally set the VERSION variable based on the matrix value
      if [[ -z "${{ matrix.version }}" ]]; then
        echo "VERSION=$(make print-VERSION)" >> $GITHUB_ENV
      else
        # else, set the VERSION variable to the matrix value and
        # skip the docker build step so we use real image tags from
        # the helm repository.
        echo "VERSION=${{ matrix.version }}" >> $GITHUB_ENV
        echo "SKIP_DOCKER=true" >> $GITHUB_ENV
      fi
      echo "CONFORMANCE_VERSION=${{ inputs.API_VERSION }}" >> $GITHUB_ENV

  - name: Setup test env
    shell: bash
    env:
      CLUSTER_NODE_VERSION: ${{ matrix.kube-version.node }}
      CONFORMANCE: "true"
      CONFORMANCE_VERSION: ${{ env.CONFORMANCE_VERSION }}
    run: ./hack/kind/setup-kind.sh

  - name: Debug Environment Variables
    shell: bash
    run: |
      echo "=== All Environment Variables ==="
      env | sort
      echo "=== Key Variables ==="
      echo "HELM_ADDITIONAL_VALUES: '${HELM_ADDITIONAL_VALUES:-NOT_SET}'"
      echo "CONFORMANCE_GATEWAY_CLASS: '${CONFORMANCE_GATEWAY_CLASS:-NOT_SET}'"
      echo "VERSION: '${VERSION:-NOT_SET}'"
      echo "================================"

  - name: Install kgateway via helm
    shell: bash
    run: |
      # Debug: Show environment variables
      echo "=== Environment Variables ==="
      echo "HELM_ADDITIONAL_VALUES: ${HELM_ADDITIONAL_VALUES}"
      echo "CONFORMANCE_GATEWAY_CLASS: ${CONFORMANCE_GATEWAY_CLASS}"
      echo "VERSION: ${VERSION}"
      echo "============================="
      
      # Check if additional Helm values file is provided
      ADDITIONAL_VALUES=""
      if [[ -n "${HELM_ADDITIONAL_VALUES}" && -f "${HELM_ADDITIONAL_VALUES}" ]]; then
        ADDITIONAL_VALUES="-f ${HELM_ADDITIONAL_VALUES}"
        echo "Using additional Helm values from: ${HELM_ADDITIONAL_VALUES}"
        echo "File contents:"
        cat "${HELM_ADDITIONAL_VALUES}"
      else
        echo "WARNING: HELM_ADDITIONAL_VALUES not set or file not found!"
        echo "HELM_ADDITIONAL_VALUES: '${HELM_ADDITIONAL_VALUES}'"
        echo "File exists: $([[ -f "${HELM_ADDITIONAL_VALUES}" ]] && echo "YES" || echo "NO")"
      fi
      
      if [[ -z "${{ matrix.version }}" ]]; then
        # If matrix.version is empty, use the local chart path specified in the Makefile.
          helm upgrade -i -n kgateway-system kgateway-crds ./install/helm/kgateway-crds/ \
          --create-namespace
        helm upgrade -i -n kgateway-system kgateway ./install/helm/kgateway/ \
          --create-namespace \
          --set image.tag=${VERSION} --set image.registry=ghcr.io/kgateway-dev \
          ${ADDITIONAL_VALUES}
      else
        # TODO(tim): this will require changes once the new helm chart is integrated
        # and published with the release pipeline.
        # Else, use the provided version to install Gloo from the helm repository.
        helm upgrade -i -n kgateway-system kgateway-crds oci://${{ env.IMAGE_REGISTRY }}/charts/kgateway-crds \
          --version ${VERSION} \
          --create-namespace
        helm upgrade -i -n kgateway-system kgateway oci://${{ env.IMAGE_REGISTRY }}/charts/kgateway \
          --version ${VERSION} \
          --create-namespace \
          --set image.tag=${VERSION} \
          ${ADDITIONAL_VALUES}
      fi
      
      # Debug: Show what was actually installed
      echo "=== Helm Release Status ==="
      helm list -n kgateway-system
      echo "=== Helm Values Applied ==="
      helm get values -n kgateway-system kgateway
      echo "==========================="

  - name: Wait for GatewayClass to be created
    shell: bash
    run: |
      # Debug: Check current state
      echo "=== Current GatewayClasses ==="
      kubectl get gatewayclasses
      echo "=== Controller Pods ==="
      kubectl get pods -n kgateway-system
      echo "=== Controller Logs ==="
      kubectl logs -n kgateway-system deploy/kgateway --tail=50
      echo "============================="
      
      # Wait for the agentgateway GatewayClass to be created by the controller
      echo "Waiting for agentgateway GatewayClass to be created..."
      kubectl wait --for=condition=Accepted gatewayclass/agentgateway --timeout=120s
      echo "GatewayClass agentgateway is ready"

  - name: Run the kubernetes gateway API conformance tests
    shell: bash
    run: |
      # Use CONFORMANCE_GATEWAY_CLASS if set, otherwise use default
      if [[ -n "${CONFORMANCE_GATEWAY_CLASS}" ]]; then
        echo "Using CONFORMANCE_GATEWAY_CLASS: ${CONFORMANCE_GATEWAY_CLASS}"
        CONFORMANCE_GATEWAY_CLASS=${CONFORMANCE_GATEWAY_CLASS} make conformance
      else
        make conformance
      fi

  - name: Capture debug information when tests fail
    if: ${{ failure() }}
    shell: bash
    run: |
      kubectl -n kgateway-system get events --sort-by='{.lastTimestamp}'
      echo
      kubectl -n gateway-conformance-infra get events --sort-by='{.lastTimestamp}'
      echo
      kubectl -n gateway-conformance-app-backend get events --sort-by='{.lastTimestamp}'
      echo
      kubectl -n gateway-conformance-web-backend get events --sort-by='{.lastTimestamp}'
      echo
      kubectl -n kgateway-system logs deploy/kgateway

  - name: Upload reports
    if: ${{ failure() }}
    uses: ./.github/actions/upload-artifact
    with:
      name: conformance-kgateway-agentgateway-report@k8s${{ matrix.kube-version.kubectl }}
      path: _test/conformance/${{ env.VERSION }}-report.yaml
