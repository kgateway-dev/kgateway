name: Restore Rust module
description: "Restore the prebuilt Envoy dynamic module (librust_module.so) that the Cache Setup workflow builds on main, so jobs that build the kgateway and envoy-wrapper images skip the uncached Rust build."

outputs:
  cache-hit:
    description: "'true' when the module for the current sources was restored"
    value: ${{ steps.restore.outputs.cache-hit }}
  key:
    description: "Cache key for the current sources, for the job that saves it"
    value: ${{ steps.key.outputs.key }}
  make-args:
    # On a hit, `-o <module>` stops make from rebuilding the restored module
    # because the fresh checkout's sources are newer than it. The cache key
    # already covers those sources.
    description: "Arguments to pass to make"
    value: ${{ steps.make-args.outputs.make-args }}

runs:
  using: "composite"
  steps:
    - name: Compute cache key
      id: key
      shell: bash
      # Bump the version when the Makefile recipe for the module changes in a
      # way its sources do not show.
      run: echo "key=rust-module-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/envoy_modules/**') }}" >> "$GITHUB_OUTPUT"
    - name: Restore module
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: _output/internal/envoy_modules/librust_module.so
        key: ${{ steps.key.outputs.key }}
        # No restore-keys: a module built from other sources is wrong, not stale.
    - name: Compute make arguments
      id: make-args
      shell: bash
      run: |
        if [[ "${{ steps.restore.outputs.cache-hit }}" == "true" ]]; then
          echo "make-args=-o $GITHUB_WORKSPACE/_output/internal/envoy_modules/librust_module.so" >> "$GITHUB_OUTPUT"
        else
          echo "make-args=" >> "$GITHUB_OUTPUT"
        fi
