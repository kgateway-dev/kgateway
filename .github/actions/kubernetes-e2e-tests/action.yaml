name: Kubernetes End-to-End tests

description: Kubernetes End-to-End tests

inputs:
  cluster-name:
    required: true
    description: The name of the cluster
  cluster-type:
    required: false
    default: "kind"
    description: The type of cluster (kind or k3d)
  test-args:
    required: true
    description: The list of arguments passed to the test invocation
  run-regex:
    required: true
    # In the future, it would be preferable to accept this as a list of strings
    # and to then build the regex from that list
    description: The regex passed to the test invocation with the -run flag
  istio-version:
    required: true
    description: The version of Istio to use
  matrix-label:
    required: true
    description: The version of the matrix being used - used to name artifacts to prevent filename collisions
  envtest-k8s-version:
    required: false
    default: '1.33'
    description: Kubernetes minor version for envtest API-server assets

  collect-coverage:
    required: false
    default: "false"
    description: >-
      Collect coverage from a coverage-instrumented controller (built with KGATEWAY_COVER=true) and
      upload it as the coverage-e2e-<cluster-name> artifact for the Test Coverage job to merge.

runs:
  using: "composite"
  steps:
    - name: Prepare coverage directory
      if: ${{ inputs.collect-coverage == 'true' }}
      id: coverage-node
      shell: bash
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}
      run: |
        set -euo pipefail
        # The instrumented controller writes coverage data to /coverage on its node when it exits.
        # It runs as a non-root user, hence the permissive mode on a throwaway CI node.
        node="$(docker ps --format '{{.Names}}' | grep -E "^(${CLUSTER_NAME}-control-plane|k3d-${CLUSTER_NAME}-server-0)$" | head -n1 || true)"
        if [[ -z "${node}" ]]; then
          echo "::warning::no cluster node found for ${CLUSTER_NAME}; skipping e2e coverage"
          exit 0
        fi
        docker exec "${node}" sh -c 'mkdir -p /coverage && chmod 777 /coverage'
        echo "node=${node}" >> "$GITHUB_OUTPUT"
        echo "KGW_E2E_COVERAGE_VALUES=${GITHUB_WORKSPACE}/test/e2e/tests/manifests/coverage.yaml" >> "$GITHUB_ENV"
    - name: Execute tests
      env:
        GO_TEST_USER_ARGS: ${{ inputs.test-args }} -run "${{ inputs.run-regex }}"
        CLUSTER_NAME: ${{ inputs.cluster-name }}
        CLUSTER_TYPE: ${{ inputs.cluster-type }}
        ISTIO_VERSION: ${{ inputs.istio-version }}
        TEST_PKG: ./test/e2e/tests
        # Doesn't really matter, but using the same as `go build` means we can re-use the same Go cache.
        CGO_ENABLED: 0
        ENVTEST_K8S_VERSION: ${{ inputs.envtest-k8s-version }}
      shell: bash
      run: make e2e-test
    - name: Archive bug report directory on failure
      if: ${{ failure() }}
      uses: ./.github/actions/upload-artifact
      with:
        name: bug-report-${{ inputs.cluster-name }}-${{ inputs.matrix-label }}
        path: ./_test/bug_report/${{ inputs.cluster-name }}
    - name: Collect coverage
      if: ${{ always() && steps.coverage-node.outputs.node != '' }}
      shell: bash
      env:
        NODE: ${{ steps.coverage-node.outputs.node }}
        CLUSTER_NAME: ${{ inputs.cluster-name }}
      run: |
        set -uo pipefail
        # Coverage data is only written when the controller exits, so stop any that are still running.
        # Suites uninstall kgateway when they finish, but a failed or interrupted run may not have.
        kubectl get deployments -A -o json \
          | jq -r '.items[] | select(any(.spec.template.spec.containers[]; .image | test("/kgateway:"))) | "\(.metadata.namespace) \(.metadata.name) \(.spec.selector.matchLabels | to_entries | map("\(.key)=\(.value)") | join(","))"' \
          | while read -r ns name selector; do
              kubectl -n "${ns}" scale deployment "${name}" --replicas=0 || true
              kubectl -n "${ns}" wait --for=delete pod -l "${selector}" --timeout=90s || true
            done
        mkdir -p _output/e2e-covdata "_output/e2e-cover"
        docker cp "${NODE}:/coverage/." _output/e2e-covdata
        if [[ -z "$(ls -A _output/e2e-covdata)" ]]; then
          echo "::warning::no e2e coverage data found for ${CLUSTER_NAME}"
          exit 0
        fi
        go tool covdata textfmt -i=_output/e2e-covdata -o=_output/e2e-cover/cover.out
    - name: Upload e2e coverage profile
      if: ${{ always() && steps.coverage-node.outputs.node != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage-e2e-${{ inputs.cluster-name }}
        path: _output/e2e-cover/cover.out
        if-no-files-found: warn
        retention-days: 7
