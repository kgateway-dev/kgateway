name: Setup KinD Cluster

description: The action that will seed a KinD cluster.

inputs:
  cluster-name:
    required: true
    description: The name of the KinD cluster
  kind-node-version:
    required: true
    description: The Node version used by KinD
  kubectl-version:
    required: true
    description: The version of Kubectl
  istio-version:
    required: true
    description: The version of Istio
  gateway-api-version:
    required: false
    default: "" # If this is undefined the setup-kind script has its own default value
    description: The version of the gateway-api to use
  gateway-api-channel:
    required: false
    default: "" # If this is undefined the setup-kind script has its own default value
    description: The channel of the gateway-api to use
  localstack:
    required: false
    default: "false"
    description: Whether to install localstack
  ip-family:
    required: false
    default: "ipv4"
    description: The IP family of the cluster - ipv4, ipv6, or dual
runs:
  using: "composite"
  steps:
    # GitHub-hosted runners ship a docker daemon with IPv6 disabled, so kind's
    # docker network has no IPv6 subnet and an ipv6/dual cluster cannot come up.
    - name: Enable IPv6 on the docker daemon
      if: ${{ inputs.ip-family != 'ipv4' }}
      shell: bash
      run: |
        sudo mkdir -p /etc/docker
        # Merge rather than overwrite: the runner image ships a daemon.json and
        # replacing it would drop whatever else it configures. Later keys win.
        # ip6tables needs no "experimental" flag on the runner's Docker (28.x);
        # it left experimental in 26.0.
        existing=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
        printf '%s\n%s\n' \
          "$existing" \
          '{"ipv6": true, "fixed-cidr-v6": "fd00:dead:beef::/64", "ip6tables": true}' \
          | jq -s 'add' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker
        # sysctls the kind nodes need to route IPv6 between pods
        sudo sysctl -w net.ipv6.conf.all.forwarding=1
        sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0
    - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
      id: kubectl
      with:
        version: ${{ inputs.kubectl-version }}
    - name: Setup test env
      shell: bash
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}
        CLUSTER_NODE_VERSION: ${{ inputs.kind-node-version }}
        ISTIO_VERSION: ${{ inputs.istio-version }}
        CONFORMANCE_VERSION: ${{ inputs.gateway-api-version }}
        CONFORMANCE_CHANNEL: ${{ inputs.gateway-api-channel }}
        LOCALSTACK: ${{ inputs.localstack }}
        IP_FAMILY: ${{ inputs.ip-family }}
      run: |
        ./hack/kind/setup-kind.sh
