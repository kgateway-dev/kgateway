name: Prep Python Runner

description: Common setup steps for Python runners

inputs:
  working-directory:
    description: directory to run setup steps in
    required: false
    default: '.'
  github-token:
    description: GitHub token used to configure git for private modules
    required: true
  arch:
    required: false
    default: amd64

runs:
  using: "composite"
  steps:
    - name: Cancel Previous Actions
      uses: styfle/cancel-workflow-action@0.12.1
      with:
        access_token: ${{ github.token }}

    - uses: actions/setup-python@v5
      id: setup_python
      with:
        python-version: '3.12'

    - name: Install dependencies for amd64 runner
      if: ${{ inputs.arch == 'amd64' }}
      shell: bash
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        python3 -m pip install -r python/requirements-dev.txt
        python3 -m pip install -r python/requirements.txt
        python3 -m pip install -r test/kubernetes/e2e/features/aiextension/tests/requirements.txt
        echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
        echo "PYTHON=$(which python)" >> $GITHUB_ENV

    - name: Install dependencies for arm64 runner
      if: ${{ inputs.arch == 'arm64' }}
      shell: bash
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        python3 -m pip install -r python/requirements-dev.txt
        echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
        echo "PYTHON=$(which python)" >> $GITHUB_ENV