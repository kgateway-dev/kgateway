name: Nightly Tests

env:
  GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }} # necessary to pass upgrade tests
  ENVOYINIT_CACHE_REF: ghcr.io/${{ github.repository_owner }}/envoy-wrapper-cache
  CONTROLLER_CACHE_REF: ghcr.io/${{ github.repository_owner }}/kgateway-cache
  SDS_CACHE_REF: ghcr.io/${{ github.repository_owner }}/sds-cache

on:
  schedule:
    - cron: "0 5 * * *" # every day @ 05:00 UTC, run tests against main and supported LTS branches
  workflow_dispatch:
    inputs:
      target_ref:
        description: "The Git ref to run tests against. Empty uses the workflow run commit."
        type: string
        required: false
        default: ""
      run-conformance:
        description: "Run conformance tests"
        type: boolean
        default: false
      run-load-tests:
        description: "Run load testing suite"
        type: boolean
        default: false
      run-e2e-tests:
        description: "Run e2e tests"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ inputs.target_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  determine_refs:
    name: Determine Refs
    runs-on: ubuntu-22.04
    outputs:
      refs: ${{ steps.determine.outputs.refs }}
      e2e_matrix: ${{ steps.determine.outputs.e2e_matrix }}
    steps:
      - id: determine
        name: Determine Refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            refs='[
              {"checkout_ref":"main","display_ref":"main"},
              {"checkout_ref":"v2.2.x","display_ref":"v2.2.x"},
              {"checkout_ref":"v2.3.x","display_ref":"v2.3.x"}
            ]'
          else
            checkout_ref="${INPUT_TARGET_REF:-}"
            display_ref="${INPUT_TARGET_REF:-}"
            if [[ -z "${checkout_ref}" ]]; then
              checkout_ref="${GITHUB_SHA}"
              display_ref="${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
            fi
            refs="$(jq -cn --arg checkout_ref "${checkout_ref}" --arg display_ref "${display_ref}" \
              '[{checkout_ref:$checkout_ref,display_ref:$display_ref}]')"
          fi
          refs="$(jq -c . <<< "${refs}")"
          echo "refs=${refs}" >> "$GITHUB_OUTPUT"

          # Build the E2E matrix entries by reading each ref's own
          # .github/nightly-gwapi-versions.json. Each branch owns the list of
          # Gateway API versions it wants tested. Missing or malformed file is
          # a hard error: every supported branch must opt in explicitly.
          #
          # Each entry is cross-producted with the env-versions list below. An
          # entry may set "envVersions": ["max"] (or similar) to opt out of a
          # given env-version label — useful when a Gateway API version's CRDs
          # require a newer k8s than the min env-version provides (e.g. v1.5.1
          # CRDs use the isIP() CEL function added in k8s 1.31).
          env_versions='[
            {"file": "./.github/workflows/.env/nightly-tests/max_versions.env", "label": "max"},
            {"file": "./.github/workflows/.env/nightly-tests/min_versions.env", "label": "min"}
          ]'
          entries="[]"
          while read -r checkout_ref display_ref; do
            versions="$(gh api \
              "repos/${GITHUB_REPOSITORY}/contents/.github/nightly-gwapi-versions.json?ref=${checkout_ref}" \
              --jq '.content' 2>/dev/null | base64 -d || true)"
            if ! jq -e 'type == "array"' >/dev/null 2>&1 <<< "${versions}"; then
              echo "::error::ref ${checkout_ref} is missing or has malformed .github/nightly-gwapi-versions.json"
              exit 1
            fi
            # The bypassVersionCheck pass-through (and any matrix entry that sets
            # it) exists only for v2.2.x's runtime-version-check escape hatch.
            # Remove this line, and the matching workflow step below, once
            # v2.2.x is EOL.
            entries="$(jq -c \
              --arg checkout_ref "${checkout_ref}" \
              --arg display_ref "${display_ref}" \
              --argjson versions "${versions}" \
              --argjson env_versions "${env_versions}" \
              '. + [
                 $versions[] as $v |
                 $env_versions[] as $ev |
                 select(($v.envVersions // ($env_versions | map(.label))) | index($ev.label)) |
                 {
                   ref: {checkout_ref: $checkout_ref, display_ref: $display_ref},
                   version: $v.version,
                   channel: $v.channel,
                   bypassVersionCheck: ($v.bypassVersionCheck // false),
                   envVersion: $ev
                 }
               ]' <<< "${entries}")"
          done < <(jq -r '.[] | "\(.checkout_ref) \(.display_ref)"' <<< "${refs}")
          echo "e2e_matrix=${entries}" >> "$GITHUB_OUTPUT"

  kube_gateway_api_conformance_tests:
    name: Conformance (ref=${{ matrix.ref.display_ref }}, type=Kubernetes Gateway API, k8s=${{ matrix.env-versions.label }}, gw-api=${{matrix.gateway-api-channel}})
    needs: determine_refs
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run-conformance ) || github.event.schedule == '0 5 * * *' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJson(needs.determine_refs.outputs.refs) }}
        env-versions:
          - file: "./.github/workflows/.env/nightly-tests/max_versions.env"
            label: max_versions
          - file: "./.github/workflows/.env/nightly-tests/min_versions.env"
            label: min_versions
        gateway-api-channel: ['experimental', 'standard']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ matrix.ref.checkout_ref }}
      - name: Dotenv Action
        uses: falti/dotenv-action@a33be0b8cf6a6e6f1b82cc9f3782061ab1022be5 # v1.1.4
        id: dotenv
        with:
          path: ${{ matrix.env-versions.file }}
          log-variables: true
      - uses: ./.github/actions/kube-conformance-tests
        with:
          test-type: gateway-api
          api-channel: ${{ matrix.gateway-api-channel }}
          kubectl-version: ${{ steps.dotenv.outputs.kubectl_version }}
          kind-node-version: ${{ steps.dotenv.outputs.node_version }}
          summarize-report: true

  kube_gateway_api_load_tests:
    name: Load Tests (ref=${{ matrix.ref.display_ref }}, type=Kubernetes Gateway API, version=${{ matrix.kube-version.node }} )
    needs: determine_refs
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run-load-tests ) || github.event.schedule == '0 5 * * *' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJson(needs.determine_refs.outputs.refs) }}
        kube-version:
          - node: 'v1.31.9@sha256:b94a3a6c06198d17f59cca8c6f486236fa05e2fb359cbd75dabbfc348a10b211'
            kubectl: v1.31.9
            kind: v0.29.0
          - node: 'v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f'
            kubectl: v1.35.0
            kind: v0.31.0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ matrix.ref.checkout_ref }}
      - uses: ./.github/actions/kube-gateway-api-load-tests

  kgateway_e2e_tests_for_gateway_api_versions:
    name: E2E (ref=${{ matrix.entry.ref.display_ref }}, k8s=${{ matrix.entry.envVersion.label }}, gw-api=${{ matrix.entry.version }}-${{ matrix.entry.channel }})
    needs: determine_refs
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run-e2e-tests ) || github.event.schedule == '0 5 * * *' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.determine_refs.outputs.e2e_matrix) }}
        controllers:
          - regex: "^TestKgateway|^TestAPIValidation|^TestListenerSet|^TestCustomGWP$$|^TestRouteReplacement$$|^TestZeroDowntimeRollout$$/^TestZeroDowntimeRollout$$|^TestControlPlaneTLS$$"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ matrix.entry.ref.checkout_ref }}
      # v2.2.x-EOL cleanup: remove this step (and the bypassVersionCheck handling in
      # determine_refs above) when v2.2.x is no longer supported. The runtime version
      # check lives only in v2.2.x; main and later branches never set the flag, so
      # nothing else needs touching. Bakes KGW_SKIP_GATEWAY_API_VERSION_CHECK into
      # the chart before setup-kind-cluster packages it (hack/kind/setup-kind.sh runs
      # `make package-kgateway-charts` from source) so the controller starts despite
      # an unsupported Gateway API version. A branch opts in via bypassVersionCheck:
      # true on its entry in .github/nightly-gwapi-versions.json.
      - name: Bypass Gateway API version check
        if: ${{ matrix.entry.bypassVersionCheck }}
        shell: bash
        run: |
          yq -i '.controller.extraEnv.KGW_SKIP_GATEWAY_API_VERSION_CHECK = "true"' \
            install/helm/kgateway/values.yaml
          echo "Set controller.extraEnv.KGW_SKIP_GATEWAY_API_VERSION_CHECK=true in install/helm/kgateway/values.yaml"
      - name: Prep Go Runner
        uses: ./.github/actions/prep-go-runner
      - name: Dotenv Action
        uses: falti/dotenv-action@a33be0b8cf6a6e6f1b82cc9f3782061ab1022be5 # v1.1.4
        id: dotenv
        with:
          path: ${{ matrix.entry.envVersion.file }}
          log-variables: true
      - name: Setup KinD Cluster
        if: ${{ steps.dotenv.outputs.cluster_type != 'k3d' }}
        uses: ./.github/actions/setup-kind-cluster
        with:
          gateway-api-version: ${{ matrix.entry.version }}
          gateway-api-channel: ${{ matrix.entry.channel }}
          cluster-name: "kgw-api-e2e-${{ matrix.entry.envVersion.label }}-${{ matrix.entry.version }}-${{ matrix.entry.channel }}"
          kubectl-version: ${{ steps.dotenv.outputs.kubectl_version }}
          istio-version: ${{ steps.dotenv.outputs.istio_version }}
          kind-node-version: ${{ steps.dotenv.outputs.node_version }}
          localstack: "true"
      - name: Setup k3d Cluster
        if: ${{ steps.dotenv.outputs.cluster_type == 'k3d' }}
        uses: ./.github/actions/setup-k3d-cluster
        with:
          gateway-api-version: ${{ matrix.entry.version }}
          gateway-api-channel: ${{ matrix.entry.channel }}
          cluster-name: "kgw-api-e2e-${{ matrix.entry.envVersion.label }}-${{ matrix.entry.version }}-${{ matrix.entry.channel }}"
          kubectl-version: ${{ steps.dotenv.outputs.kubectl_version }}
          istio-version: ${{ steps.dotenv.outputs.istio_version }}
          node-version: ${{ steps.dotenv.outputs.node_version }}
          localstack: "true"
          github-token: ${{ github.token }}
      - id: run-tests
        uses: ./.github/actions/kubernetes-e2e-tests
        env:
          VERSION: 'v1.0.0-ci1'
          GITHUB_TOKEN: ${{ github.token }}
          GO_TEST_RETRIES: '3' # Use a higher number of retries because there are so many tests and we don't want to rerun
          # A single test failure counts as a failure for each of its parent suites, and these tests run for a long time, so use a higher max failure count
          GOTESTSUM_ARGS: '--format=standard-verbose --rerun-fails-max-failures 25'
        with:
          cluster-name: "kgw-api-e2e-${{ matrix.entry.envVersion.label }}-${{ matrix.entry.version }}-${{ matrix.entry.channel }}"
          cluster-type: ${{ steps.dotenv.outputs.cluster_type || 'kind' }}
          test-args: '-timeout=120m'
          run-regex: ${{ matrix.controllers.regex }}
          istio-version: ${{ steps.dotenv.outputs.istio_version }}
          matrix-label: "nightly-kgw-api-${{ matrix.entry.envVersion.label }}-${{ matrix.entry.version }}-${{ matrix.entry.channel }}"
