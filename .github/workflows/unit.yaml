name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

env:
  VERSION: 'v1.0.0-ci1'
  GITHUB_TOKEN: ${{ github.token }}
  GO_TEST_RETRIES: 2
  ENVOYINIT_CACHE_REF: ghcr.io/${{ github.repository_owner }}/envoy-wrapper-cache
  CGO_ENABLED: '0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Runs the unit tests for Go packages
  go:
    name: Go Unit Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Prep Go Runner
        id: prep-go-runner
        uses: ./.github/actions/prep-go-runner
      - name: Restore Race Go Build Cache
        # The tests below run with `CGO_ENABLED=1 -race`, which compiles a
        # distinct set of GOCACHE entries from the CGO-disabled cache that
        # prep-go-runner restores. This race-instrumented cache is seeded by
        # the Cache Setup workflow on main; restore it so unit runs start warm.
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.prep-go-runner.outputs.go-build-cache-path }}
          key: ${{ steps.prep-go-runner.outputs.go-build-cache-key-race }}
          # This job only restores (never saves), so falling back to the
          # previous race-cache generation on a go.sum change is a strict win:
          # the -race build recompiles just the delta instead of the world.
          restore-keys: |
            ${{ steps.prep-go-runner.outputs.go-build-cache-restore-key-race }}
      - name: Detect validator image rebuild
        id: validator-image
        shell: bash
        run: |
          set -euo pipefail

          rebuild=false
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            rebuild=true
          elif ! git diff --quiet "${{ github.event.pull_request.base.sha }}...HEAD" -- cmd/envoyinit/ internal/envoy_modules/ Makefile; then
            rebuild=true
          fi

          sha="$(git rev-parse --short=12 HEAD)"
          {
            echo "rebuild=${rebuild}"
            echo "image=ghcr.io/kgateway-dev/envoy-wrapper:pr-${sha}"
            echo "version=pr-${sha}"
          } >> "$GITHUB_OUTPUT"
      - name: Setup Buildx
        if: ${{ steps.validator-image.outputs.rebuild == 'true' }}
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build validator image
        if: ${{ steps.validator-image.outputs.rebuild == 'true' }}
        env:
          VERSION: ${{ steps.validator-image.outputs.version }}
        run: make envoy-wrapper-docker
      - name: Use locally built validator image
        if: ${{ steps.validator-image.outputs.rebuild == 'true' }}
        shell: bash
        run: |
          echo "KGATEWAY_VALIDATOR_ENVOY_IMAGE=${{ steps.validator-image.outputs.image }}" >> "$GITHUB_ENV"
          echo "KGATEWAY_VALIDATOR_DOCKER_PULL_POLICY=never" >> "$GITHUB_ENV"
      - name: Pre-pull validator image
        # When rebuild=true the image was built locally and pull-policy is "never",
        # so this step only matters for the default ghcr.io image path. Pulling it
        # once up front (with retries) avoids per-test ghcr.io timeout flakes in
        # the strict-validation tests, which spawn `docker run --pull always` for
        # every validation invocation.
        if: ${{ steps.validator-image.outputs.rebuild == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          validator_image="${KGATEWAY_VALIDATOR_ENVOY_IMAGE:-}"
          if [[ -z "$validator_image" ]]; then
            validator_image="$(< pkg/validator/default_envoy_image.txt)"
          fi
          if [[ -z "$validator_image" ]]; then
            echo "validator image is empty" >&2
            exit 1
          fi

          attempt=1
          max_attempts=5
          delay=5
          until docker pull "$validator_image"; do
            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "docker pull failed after $attempt attempts" >&2
              exit 1
            fi
            echo "docker pull attempt $attempt failed; retrying in ${delay}s" >&2
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
          # The image is now in the local docker daemon cache; tell the validator
          # to use it without re-pulling on every invocation.
          echo "KGATEWAY_VALIDATOR_ENVOY_IMAGE=${validator_image}" >> "$GITHUB_ENV"
          echo "KGATEWAY_VALIDATOR_DOCKER_PULL_POLICY=never" >> "$GITHUB_ENV"
      - name: Package helm charts
        # Produces the real release artifact (_test/kgateway-*.tgz) via the same
        # `make package-kgateway-charts` target release.yaml runs, so the
        # packaged-chart parity test in ./test/helm has something to render
        # against. KGW_REQUIRE_PACKAGED_CHART below makes that test fail loudly
        # if this step is ever dropped, instead of silently skipping.
        shell: bash
        run: make package-kgateway-charts
      - name: Run Tests
        shell: bash
        env:
          CGO_ENABLED: '1'
          KGW_REQUIRE_PACKAGED_CHART: 'true'
        run: make unit-with-coverage
      - name: Upload coverage profile
        # Consumed by the `coverage` job, which stitches this profile together
        # with any other `coverage-*` artifacts into one report.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-unit
          path: _output/cover.out
          if-no-files-found: error
          retention-days: 7

  # Merges coverage profiles from every test run, reports how well the lines
  # changed by the PR are covered, publishes an HTML report, and enforces the
  # thresholds in test_coverage.yml.
  coverage:
    name: Test Coverage
    needs: go
    runs-on: ubuntu-22.04
    # Includes waiting for the end-to-end shards (e2e.yaml), which run for up to ~1h45m after the PR is pushed.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Prep Go Runner
        uses: ./.github/actions/prep-go-runner
      - name: Download coverage profiles
        # Any job that uploads a `coverage-<name>/cover.out` artifact is merged in.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: _output/coverage
      - name: Fetch e2e coverage
        id: e2e
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Unit coverage alone understates what the tests exercise, so wait for the e2e run of this
          # commit and stitch its per-shard profiles in. If it never completes successfully we still
          # report, but do not enforce thresholds against partial data.
          deadline=$((SECONDS + 6300))
          while (( SECONDS < deadline )); do
            run="$(gh run list --workflow e2e.yaml --commit "${SHA}" --event "${EVENT}" --limit 1 \
              --json databaseId,status,conclusion --jq '.[0] // empty')"
            if [[ -n "${run}" && "$(jq -r .status <<<"${run}")" == "completed" ]]; then
              if [[ "$(jq -r .conclusion <<<"${run}")" == "success" ]]; then
                gh run download "$(jq -r .databaseId <<<"${run}")" --pattern 'coverage-e2e-*' --dir _output/coverage
                echo "complete=true" >> "$GITHUB_OUTPUT"
              else
                echo "::warning::e2e run did not succeed; coverage thresholds are not enforced"
                echo "complete=false" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            sleep 60
          done
          echo "::warning::timed out waiting for the e2e run; coverage thresholds are not enforced"
          echo "complete=false" >> "$GITHUB_OUTPUT"
      - name: Report and validate coverage
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          E2E_COMPLETE: ${{ steps.e2e.outputs.complete }}
        run: |
          set -euo pipefail
          profiles="$(find _output/coverage -name cover.out | sort | paste -sd, -)"
          echo "Merging: ${profiles}"
          args=(COVERAGE_PROFILES="${profiles}")
          # Patch coverage only makes sense against a PR base; merge queue runs only check totals.
          if [[ -n "${BASE_REF}" ]]; then
            git fetch --no-tags origin "${BASE_REF}"
            args+=(COVERAGE_BASE="origin/${BASE_REF}")
          fi
          make html-test-coverage "${args[@]}"
          if [[ "${E2E_COMPLETE}" == "true" ]]; then
            make validate-test-coverage COVERAGE_PROFILES="${profiles}"
          fi
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-html
          path: |
            _output/coverage.html
            _output/cover.merged.out
          if-no-files-found: ignore
          retention-days: 14

  # Catches version drift between go.mod, Dockerfile, and Makefile
  version-drift:
    name: Version Drift Check
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: tools/go.mod
      - name: Run drift tests
        working-directory: tools
        run: go test -v -count=1 ./build-tools/
