# ProxyDeployment: Strategy is fully fleshed out
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: test-proxy-deployment-empty
spec:
  kube:
    deployment:
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 100%
          maxUnavailable: 1
---
# ProxyDeployment: Strategy sets maxSurge and uses implicit type RollingUpdate
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: test-proxy-deployment-maxsurge
spec:
  kube:
    deployment:
      strategy:
        rollingUpdate:
          maxSurge: 100%
---
# ProxyDeployment: Strategy has an empty rollingUpdate override
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: test-proxy-deployment-rollingupdate-empty
spec:
  kube:
    deployment:
      strategy:
        rollingUpdate: {}
---
# ProxyDeployment: Strategy Recreate
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: test-proxy-deployment-recreate
spec:
  kube:
    deployment:
      strategy:
        type: Recreate
---
# ProxyDeployment: Strategy has an unknown rollout type and acts in a forwards-compatible fashion
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: test-proxy-deployment-unknownstrategem
spec:
  kube:
    deployment:
      strategy:
        type: SomeStrategemIntroducedInTheFuture
