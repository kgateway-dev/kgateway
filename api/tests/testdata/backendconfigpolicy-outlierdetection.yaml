apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: consecutive-gateway-failure
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: httpbin
  outlierDetection:
    consecutiveGatewayFailure: 1
---
_err: should be greater than or equal to 1
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: consecutive-gateway-failure-zero
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: httpbin
  outlierDetection:
    consecutiveGatewayFailure: 0
