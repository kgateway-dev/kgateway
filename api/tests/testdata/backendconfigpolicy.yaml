# BackendConfigPolicy: enforce AtMostOneOf for HTTP protocol options
_err: 'at most one of the fields in [http1ProtocolOptions http2ProtocolOptions] may be set'
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: backend-config-both-http-options
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: test-service
  http1ProtocolOptions:
    enableTrailers: true
  http2ProtocolOptions:
    maxConcurrentStreams: 100
    overrideStreamErrorOnInvalidHttpMessage: true
---
# BackendConfigPolicy: HTTP2 protocol options with integer values
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: backend-config-http2-integers
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: test-service
  http2ProtocolOptions:
    initialConnectionWindowSize: 65535
    initialStreamWindowSize: 2147483647
    maxConcurrentStreams: 100
---
# BackendConfigPolicy: HTTP2 protocol options with string values
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: backend-config-http2-strings
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: test-service
  http2ProtocolOptions:
    initialConnectionWindowSize: "65535"
    initialStreamWindowSize: "2147483647"
    maxConcurrentStreams: 100
---
# BackendConfigPolicy: HTTP2 protocol options with invalid integer values
_err: InitialConnectionWindowSize must be between 65535 and 2147483647 bytes (inclusive)
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: backend-config-http2-invalid-integers
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: test-service
  http2ProtocolOptions:
    initialConnectionWindowSize: 1000
    initialStreamWindowSize: 2147483648
---
# BackendConfigPolicy: valid target references
