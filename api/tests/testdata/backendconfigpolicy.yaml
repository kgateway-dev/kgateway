# BackendConfigPolicy: invalid durations
_errs:
- 'spec.commonHttpProtocolOptions.idleTimeout: Invalid value: "1x": invalid duration value'
- 'spec.commonHttpProtocolOptions.maxStreamDuration: Invalid value: "abc": invalid duration value'
- 'spec.connectTimeout: Invalid value: "-1s": invalid duration value'
- 'spec.healthCheck.interval: Invalid value: "b": invalid duration value'
- 'spec.healthCheck.noTrafficInterval: Invalid value: "0s": noTrafficInterval must be at least 1ms'
- 'spec.healthCheck.timeout: Invalid value: "a": invalid duration value'
- 'spec.http2ProtocolOptions.connectionKeepalive.interval: Invalid value: "1x": invalid duration value'
- 'spec.http2ProtocolOptions.connectionKeepalive.interval: Invalid value: "string": type conversion error from ''string'' to ''google.protobuf.Duration'' evaluating rule: interval must be at least 1ms'
- 'spec.http2ProtocolOptions.connectionKeepalive.timeout: Invalid value: "0s": timeout must be at least 1ms'
- 'spec.loadBalancer.updateMergeWindow: Invalid value: "z": invalid duration value'
- 'spec.tcpKeepalive.keepAliveInterval: Invalid value: "0": invalid duration value'
- 'spec.tcpKeepalive.keepAliveInterval: Invalid value: "0": keepAliveInterval must be at least 1 second'
- 'spec.tcpKeepalive.keepAliveTime: Invalid value: "0s": keepAliveTime must be at least 1 second'
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: backend-config-invalid-duration
spec:
  connectTimeout: -1s
  commonHttpProtocolOptions:
    idleTimeout: 1x
    maxStreamDuration: abc
  tcpKeepalive:
    keepAliveTime: 0s
    keepAliveInterval: "0"
  http2ProtocolOptions:
    connectionKeepalive:
      timeout: 0s
      interval: 1x
  healthCheck:
    timeout: a
    interval: b
    noTrafficInterval: 0s
    unhealthyThreshold: 3
    healthyThreshold: 2
    http:
      path: /healthz
      host: example.com
      method: HEAD
  loadBalancer:
    updateMergeWindow: z
    roundRobin:
      slowStart:
        window: 10s
---
# BackendConfigPolicy: sessionPersistence valid cookie
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: sp-valid-cookie
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: test-service
  sessionPersistence:
    type: Cookie
    absoluteTimeout: 1h
    cookie:
      name: my-session
      path: /app
      lifetimeType: Permanent
