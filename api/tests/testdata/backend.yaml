# Backend: enforce ExactlyOneOf for backend type
_err: 'exactly one of the fields in [aws static dynamicForwardProxy gcp priorityGroups] must be set'
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: backend-oneof
spec:
  type: AWS
  aws:
    accountId: "000000000000"
    lambda:
      functionName: hello-function
      invocationMode: Async
  static:
    hosts:
    - host: example.com
      port: 80
---
# Backend: empty lambda qualifier does not match pattern
_err: 'spec.aws.lambda.qualifier in body should match '
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: backend-empty-lambda-qualifier
spec:
  type: AWS
  aws:
    accountId: "000000000000"
    lambda:
      functionName: hello-function
      qualifier: ""
---
# Backend: AWS backend requires exactly one of lambda or ec2
_err: 'exactly one of the fields in [lambda ec2] must be set'
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: backend-aws-oneof
spec:
  type: AWS
  aws:
    accountId: "000000000000"
    lambda:
      functionName: hello-function
    ec2:
      port: 8080
      addressType: PrivateIP
---
# Backend: invalid EC2 address type
_err: 'spec.aws.ec2.addressType: Unsupported value: "InternalIP": supported values: "PrivateIP", "PublicIP"'
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: backend-ec2-address-type
spec:
  type: AWS
  aws:
    ec2:
      port: 8080
      addressType: InternalIP
---
# Backend: invalid AssumeRole role ARN
_err: spec.aws.auth.assumeRole.roleArn in body should match
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: backend-assume-role-arn
spec:
  type: AWS
  aws:
    auth:
      type: AssumeRole
      assumeRole:
        roleArn: not-an-arn
    ec2:
      port: 8080
---
# Backend: EC2 tag filter requires exactly one branch
_err: 'exactly one of the fields in [key keyValue] must be set'
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: backend-ec2-tag-filter-oneof
spec:
  type: AWS
  aws:
    ec2:
      filters:
      - key: owner
        keyValue:
          key: app
          value: payments
---
# Backend: static host port must be between 1 and 65535
_err: 'port must be between 1 and 65535'
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: backend-static-port-too-large
spec:
  type: Static
  static:
    hosts:
    - host: example.com
      port: 70000
---
# Backend: ec2 port 0 is allowed and means the default of 80
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: backend-ec2-port-zero
spec:
  type: AWS
  aws:
    accountId: "000000000000"
    ec2:
      port: 0
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: dfp-ipv4-only
spec:
  type: DynamicForwardProxy
  dynamicForwardProxy:
    dnsLookupFamily: IPv4Only
---
_err: 'spec.dynamicForwardProxy.dnsLookupFamily: Unsupported value'
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: dfp-invalid-dns-lookup-family
spec:
  type: DynamicForwardProxy
  dynamicForwardProxy:
    dnsLookupFamily: V4_ONLY
