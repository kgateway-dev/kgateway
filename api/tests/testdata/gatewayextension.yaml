# GatewayExtension: extAuth statusOnError must be a status code Envoy defines
_err: 'spec.extAuth.statusOnError: Unsupported value: 418'
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: gwext-extauth-status-on-error-undefined
spec:
  extAuth:
    grpcService:
      backendRef:
        name: ext-authz
        port: 80
    statusOnError: 418
---
# GatewayExtension: extProc messageTimeout must be at most 1h
_err: 'timeout must be at most 1h.'
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: gwext-extproc-message-timeout-too-large
spec:
  extProc:
    grpcService:
      backendRef:
        name: ext-proc
        port: 80
    messageTimeout: 2h
---
# GatewayExtension: gRPC ext-auth accepts metadata namespaces
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: extauth-grpc-metadata-namespaces-valid
spec:
  type: ExtAuth
  extAuth:
    grpcService:
      backendRef:
        name: ext-authz
        port: 9000
    metadataContextNamespaces:
    - envoy.filters.http.jwt_authn
---
# GatewayExtension: an explicitly empty list is valid for gRPC ext-auth
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: extauth-grpc-metadata-namespaces-empty
spec:
  type: ExtAuth
  extAuth:
    grpcService:
      backendRef:
        name: ext-authz
        port: 9000
    metadataContextNamespaces: []
---
# GatewayExtension: HTTP ext-auth rejects metadata namespaces
_err: metadataContextNamespaces is only supported with grpcService
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: extauth-http-metadata-namespaces-invalid
spec:
  type: ExtAuth
  extAuth:
    httpService:
      backendRef:
        name: ext-authz
        port: 8080
    metadataContextNamespaces:
    - envoy.filters.http.jwt_authn
---
# GatewayExtension: HTTP ext-auth rejects even an empty namespace list
_err: metadataContextNamespaces is only supported with grpcService
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: extauth-http-metadata-namespaces-empty-invalid
spec:
  type: ExtAuth
  extAuth:
    httpService:
      backendRef:
        name: ext-authz
        port: 8080
    metadataContextNamespaces: []
---
# GatewayExtension: metadata namespace items cannot be empty
_err: metadataContextNamespaces[0] in body should be at least 1 chars long
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: extauth-grpc-metadata-namespace-empty-item
spec:
  type: ExtAuth
  extAuth:
    grpcService:
      backendRef:
        name: ext-authz
        port: 9000
    metadataContextNamespaces:
    - ""
---
# GatewayExtension: a post-AuthN metadata consumer cannot clear the route cache,
# because a route recomputed after JWT validation could bypass the destination route's JWT requirement.
_err: clearRouteCache cannot be used with metadataContextNamespaces because post-AuthN route changes could bypass destination route JWT requirements
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: extauth-grpc-metadata-route-cache-invalid
spec:
  type: ExtAuth
  extAuth:
    grpcService:
      backendRef:
        name: ext-authz
        port: 9000
    metadataContextNamespaces: []
    clearRouteCache: true
---
# GatewayExtension: metadata namespaces are bounded
_err: 'spec.extAuth.metadataContextNamespaces: Too many: 33: must have at most 32 items'
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayExtension
metadata:
  name: extauth-grpc-metadata-namespaces-too-many
spec:
  type: ExtAuth
  extAuth:
    grpcService:
      backendRef:
        name: ext-authz
        port: 9000
    metadataContextNamespaces:
    - namespace-01
    - namespace-02
