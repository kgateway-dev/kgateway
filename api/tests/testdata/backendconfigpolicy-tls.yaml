apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: no-trust-source
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: backend
  tls:
    sni: example.com
    simpleTLS: true
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: system-ca
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: backend
  tls:
    wellKnownCACertificates: System
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: insecure-skip-verify-false-with-sni
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: backend
  tls:
    sni: example.com
    insecureSkipVerify: false
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: insecure-skip-verify-true-without-sni
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: backend
  tls:
    insecureSkipVerify: true
---
_err: sni is required when no trust source is set
